<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1f2a37">
<meta name="mobile-web-app-capable" content="yes">
<title>Levantamiento — Croquis con láser</title>
<style>
:root{--bg:#f4f1ea;--ink:#1f2a37;--muted:#6b7280;--acc:#0f6fde;--ok:#15803d;--warn:#d97706;--danger:#b91c1c;--line:#d6d3cc;--dim:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--ink);color:#fff}
header .title{flex:1;min-width:0;cursor:pointer}
header .title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .title span{font-size:12px;opacity:.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:#e7e4dc;color:var(--ink);cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#fff}
button.danger{background:#fde8e8;color:var(--danger)}
button.ghost{background:transparent}
.hbtn{background:rgba(255,255,255,.12);color:#fff;padding:8px 10px;font-size:14px;white-space:nowrap}
.btbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ca3af;margin-right:6px;vertical-align:middle}
.btbtn.on .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.btbtn.busy .dot{background:#f59e0b}
.last{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:56px;text-align:right}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:10px;top:8px;right:120px;font-size:12px;color:var(--muted);pointer-events:none;line-height:1.35}
.pill{position:absolute;right:10px;top:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.fab{position:absolute;right:10px;top:40px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
#vanoBar{position:absolute;left:10px;top:52px;display:none}
.tools{display:flex;gap:2px;padding:6px 4px;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tool{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 3px;font-size:10.5px;background:transparent;min-width:44px}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.active{background:var(--ink);color:#fff}
.sep{width:1px;background:var(--line);margin:4px 2px;flex:0 0 1px}
.props{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;display:none;z-index:5}
.props .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.props .row+.row{margin-top:8px}
.props .name{font-weight:700;font-size:15px}
.props .sub{font-size:12px;color:var(--muted)}
.props .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.props .val.miss{color:var(--warn)}
.props .val.okv{color:var(--ok)}
.props input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:84px;font-variant-numeric:tabular-nums}
.props input.wide{width:100%;flex:1}
.props input.tgt{border-color:var(--acc);box-shadow:0 0 0 2px rgba(15,111,222,.25)}
.props label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.props button{padding:8px 10px;font-size:13px}
.seg{display:inline-flex;background:#e7e4dc;border-radius:10px;padding:2px}
.seg button{background:transparent;padding:6px 10px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.waiting{font-size:12px;color:var(--acc)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:60}
#toast.show{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.sheet .f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.sheet .f input{font:inherit;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:10px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .plist .it{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.sheet .plist .it.cur{border-color:var(--acc);background:#eef5ff}
.sheet .plist .it div{flex:1;min-width:0}
.sheet .plist .it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .plist .it small{color:var(--muted)}
.sheet .tg{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px}
.sheet .tg input{width:22px;height:22px}
.sheet p{font-size:14px;line-height:1.45;margin:6px 0}
.sheet code{background:#f1efe9;padding:1px 4px;border-radius:4px;font-size:12px;word-break:break-all}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.big{display:block;width:100%;margin-bottom:8px;padding:14px;font-size:15px}
#ped{position:fixed;inset:0;z-index:30;background:#111;display:none}
#ped.show{display:flex}
#ped .stage{background:#111}
#ped .hint{color:#cbd5e1}
#pedName{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;padding:4px 2px}
</style>
</head>
<body>
<!-- ============ PLANO ============ -->
<div class="app" id="planApp">
  <header>
    <div class="title" id="ptitle"><b id="pname">Levantamiento</b><span id="paddr">Toca para datos, proyectos y exportar</span></div>
    <div class="last" title="Última medida">—</div>
    <button class="hbtn btbtn"><span class="dot"></span>Láser</button>
    <button class="hbtn" id="menuBtn" aria-label="Menú">☰</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="pill" id="count">0/0</div>
    <button class="fab" id="fitBtn">⤢ Encuadrar</button>
    <button class="fab" id="orthoBtn" style="top:72px"></button>
    <div id="vanoBar" class="seg"><button data-op="door">Puerta</button><button data-op="win">Ventana</button><button data-op="gap">Vano vacío</button></div>
    <div class="props" id="props"></div>
  </div>
  <nav class="tools">
    <button class="tool" data-tool="ext"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" fill="currentColor"/></svg>Muro</button>
    <button class="tool" data-tool="tab"><svg viewBox="0 0 24 24"><rect x="3" y="10.5" width="18" height="3" fill="currentColor"/></svg>Tabique</button>
    <button class="tool" data-tool="vano"><svg viewBox="0 0 24 24"><path d="M2 20h5M17 20h5M7 20V6a10 10 0 0110 10v4"/></svg>Vano</button>
    <button class="tool" data-tool="dim"><svg viewBox="0 0 24 24"><path d="M4 18L20 6M4 14v8M20 2v8"/></svg>Cota</button>
    <button class="tool" data-tool="txt"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>Texto</button>
    <button class="tool" data-tool="foto"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button>
    <button class="tool" data-tool="sel"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Elegir</button>
    <span class="sep"></span>
    <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Deshacer</button>
  </nav>
</div>

<!-- ============ EDITOR DE FOTO ============ -->
<div class="app" id="ped">
  <header>
    <button class="hbtn" id="pedBack">‹ Plano</button>
    <input id="pedName" placeholder="Descripción de la foto">
    <div class="last">—</div>
    <button class="hbtn btbtn"><span class="dot"></span>Láser</button>
  </header>
  <div class="stage" id="pstage">
    <canvas id="pcv"></canvas>
    <div class="hint" id="phint"></div>
    <div class="pill" id="pcount">0/0</div>
    <button class="fab" id="pfitBtn">⤢ Encuadrar</button>
    <div class="props" id="pprops"></div>
  </div>
  <nav class="tools">
    <button class="tool" data-ptool="arrow"><svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>Cota</button>
    <button class="tool" data-ptool="note"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Texto</button>
    <button class="tool" data-ptool="sel"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Elegir</button>
    <span class="sep"></span>
    <button class="tool" id="pUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Deshacer</button>
    <button class="tool" id="pExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M4 15v5h16v-5"/></svg>Exportar</button>
    <button class="tool" id="pDelPhoto"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Borrar</button>
  </nav>
</div>

<div id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>

<script>
"use strict";
/* ============ Constantes y estado ============ */
const SVC = '02a6c0d0-0451-4000-b000-fb3210111989';
const CHR = '02a6c0d1-0451-4000-b000-fb3210111989';
const STORE = 'levantamientos_v1';
const DEF_SET = {tExt:0.20, tTab:0.10, ortho:true, auto:true, faceDef:'int', square:true};
const OPDEF = {door:0.80, win:1.20, gap:0.90};
const OPNAME = {door:'Puerta', win:'Ventana', gap:'Vano vacío'};
const OPPRE = {door:'P', win:'V', gap:'VN'};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let db = {projects:[], current:null, settings:{...DEF_SET}};
let P = null;
let view = {s:40, ox:0, oy:0};
let W = 0, H = 0, dpr = 1;
let tool = 'ext', opKind = 'door';
let sel = null;               // {kind:'wall'|'dim'|'label'|'open'|'photo', id, field}
let draft = null;
let aimDraft = null;   // nueva foto: {x,y,dir} mientras se arrastra la dirección
let undoStack = [];
let lastMeasure = null;
let bt = {dev:null, ch:null, state:'off', lastRaw:'', lastT:0, lastV:null};

/* ============ Almacenamiento ============ */
function load(){
  try{
    const r = localStorage.getItem(STORE);
    if(r){ const d = JSON.parse(r); db.projects = d.projects||[]; db.current = d.current; db.settings = {...DEF_SET, ...(d.settings||{})}; if(db.settings.interior===false && !(d.settings||{}).faceDef) db.settings.faceDef='eje'; }
  }catch(e){}
}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }
function saveNow(){ try{ localStorage.setItem(STORE, JSON.stringify(db)); }catch(e){ toast('No se pudo guardar en el teléfono'); } }
function normalize(p){
  p.walls=p.walls||[]; p.dims=p.dims||[]; p.labels=p.labels||[]; p.openings=p.openings||[]; p.photos=p.photos||[]; p.log=p.log||[];
  p.cnt=p.cnt||{}; p.fcnt=p.fcnt||0; p.aligns=p.aligns||[]; p.seq=p.seq||1; return p;
}
function blankProject(name){
  return normalize({id:'p'+Date.now()+Math.floor(Math.random()*1000), name:name||'Levantamiento', address:'', owner:'', date:new Date().toISOString().slice(0,10)});
}
function newProject(name){ const p = blankProject(name); db.projects.unshift(p); openProject(p.id); return p; }
function openProject(id){
  db.current = id; P = db.projects.find(p=>p.id===id);
  if(!P){ P = blankProject(); db.projects.unshift(P); db.current = P.id; }
  normalize(P); sel = null; draft = null; undoStack = [];
  save(); updateHeader(); fitView(); renderProps(); draw();
}

/* IndexedDB para las fotos (no caben en el almacenamiento normal) */
const idb = {
  d:null,
  open(){ return new Promise((res,rej)=>{ if(this.d) return res(this.d); const r=indexedDB.open('levantamiento_fotos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>{ this.d=r.result; res(this.d); }; r.onerror=()=>rej(r.error); }); },
  async tx(mode, fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('img',mode); const st=t.objectStore('img'); const rq=fn(st); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); }); },
  put(k,v){ return this.tx('readwrite', st=>st.put(v,k)); },
  get(k){ return this.tx('readonly', st=>st.get(k)); },
  del(k){ return this.tx('readwrite', st=>st.delete(k)); }
};

/* ============ Utilidades ============ */
const fmt = v => (v==null||isNaN(v)) ? '?' : v.toFixed(2);
const r3 = v => Math.round(v*1000)/1000;
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms||2200); }
function w2s(p, v){ v=v||view; return {x:p.x*v.s+v.ox, y:p.y*v.s+v.oy}; }
function s2w(x, y){ return {x:(x-view.ox)/view.s, y:(y-view.oy)/view.s}; }
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let t = L2? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t)); const x=ax+dx*t, y=ay+dy*t; return {d:Math.hypot(px-x,py-y), t, x, y};
}
const len = e => Math.hypot(e.b.x-e.a.x, e.b.y-e.a.y);
const num = v => { const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };
function arrOf(kind, p){ p=p||P; return kind==='wall'?p.walls : kind==='dim'?p.dims : kind==='open'?p.openings : kind==='photo'?p.photos : p.labels; }
function getEl(s){ if(!s) return null; return arrOf(s.kind).find(e=>e.id===s.id)||null; }
function wallOf(o, p){ return (p||P).walls.find(w=>w.id===o.wall); }
function snapshot(){ return JSON.stringify({walls:P.walls, dims:P.dims, labels:P.labels, openings:P.openings, aligns:P.aligns, cnt:P.cnt, seq:P.seq, dirty:P.dirty!==false, rectified:!!P.rectified,
  fcnt:P.fcnt, phMeta:P.photos.map(f=>({id:f.id,x:f.x,y:f.y,name:f.name,dir:f.dir}))}); }
function pushUndo(){ undoStack.push(snapshot()); if(undoStack.length>80) undoStack.shift(); P.dirty=true; }
function undo(){
  const s = undoStack.pop(); if(!s){ toast('Nada que deshacer'); return; }
  const d=JSON.parse(s); const meta=d.phMeta||[]; delete d.phMeta;
  Object.assign(P, d); for(const m of meta){ const f=P.photos.find(x=>x.id===m.id); if(f){ f.x=m.x; f.y=m.y; f.name=m.name; f.dir=m.dir; } }
  sel=null; save(); renderProps(); draw();
}
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function nextName(prefix){ P.cnt[prefix]=(P.cnt[prefix]||0)+1; return prefix+P.cnt[prefix]; }

/* ============ Diálogos ============ */
function openSheet(html){ $('#sheet').innerHTML = html; $('#modal').classList.add('show'); }
function closeSheet(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeSheet(); });
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ask(title, msg, okText, danger){
  return new Promise(res=>{
    openSheet(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button id="dNo">Cancelar</button><button id="dOk" class="${danger?'danger':'pri'}">${esc(okText||'Aceptar')}</button></div>`);
    $('#dNo').onclick=()=>{closeSheet();res(false)}; $('#dOk').onclick=()=>{closeSheet();res(true)};
  });
}
function askText(title, value, placeholder){
  return new Promise(res=>{
    openSheet(`<h2>${esc(title)}</h2><div class="f"><input id="dIn" value="${esc(value||'')}" placeholder="${esc(placeholder||'')}"></div><div class="actions"><button id="dNo">Cancelar</button><button id="dOk" class="pri">Aceptar</button></div>`);
    const i=$('#dIn'); setTimeout(()=>i.focus(),50);
    const ok=()=>{const v=i.value.trim(); closeSheet(); res(v||null)};
    $('#dNo').onclick=()=>{closeSheet();res(null)}; $('#dOk').onclick=ok; i.onkeydown=e=>{if(e.key==='Enter')ok()};
  });
}

/* ============ Vista del plano ============ */
function resize(){
  dpr = window.devicePixelRatio||1;
  const r = $('#stage').getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); draw();
  if(PE.open) pedResize();
}
function bounds(p){
  p = p||P; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  const add=q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)};
  p.walls.forEach(w=>{add(w.a);add(w.b)}); p.dims.forEach(d=>{add(d.a);add(d.b)}); p.labels.forEach(l=>add(l));
  p.photos.forEach(f=>{ if(f.x!=null) add(f); });
  return isFinite(x0) ? {x0,y0,x1,y1} : null;
}
function fitView(){
  if(!W){ const r=$('#stage').getBoundingClientRect(); W=r.width; H=r.height; }
  const b = P && bounds();
  if(!b){ view.s = 40; view.ox = W/2; view.oy = H/2; draw(); return; }
  const bw=Math.max(b.x1-b.x0,1), bh=Math.max(b.y1-b.y0,1);
  view.s = Math.max(5, Math.min(300, Math.min((W-80)/bw, (H-150)/bh)));
  view.ox = W/2 - (b.x0+bw/2)*view.s; view.oy = H/2 - (b.y0+bh/2)*view.s + 10; draw();
}

/* ============ Geometría de vanos ============ */
/* caras de muros que llegan a un punto (para medidas cara a cara) */
const near=(a,b,tol)=>Math.abs(a.x-b.x)<(tol||1e-4) && Math.abs(a.y-b.y)<(tol||1e-4);
function wallsAt(pt, p, except){
  // muros cuyo extremo coincide con pt, o que pasan por pt (encuentro en T)
  const out=[];
  for(const x of (p||P).walls){
    if(x===except) continue; const L=len(x); if(L<1e-6) continue;
    if(near(x.a,pt)||near(x.b,pt)||pt.on===x.id){ out.push(x); continue; }
    const r=segDist(pt.x,pt.y,x.a.x,x.a.y,x.b.x,x.b.y); if(r.d<0.05 && r.t>0.001 && r.t<0.999) out.push(x);
  }
  return out;
}
const FACES={int:'Interior', ext:'Exterior', eje:'Eje'};
const FACESIGN={int:1, ext:-1, eje:0};
function faceOf(e){ return e.face || db.settings.faceDef || 'int'; }
const faceTag = e => faceOf(e)==='int' ? '' : ' '+faceOf(e);
function faceAt(w, pt, p){
  const L=len(w); if(L<1e-6) return 0; const ux=(w.b.x-w.a.x)/L, uy=(w.b.y-w.a.y)/L; let f=0;
  for(const x of wallsAt(pt,p,w)){ const Lx=len(x); const d=Math.abs(ux*(x.b.x-x.a.x)/Lx+uy*(x.b.y-x.a.y)/Lx); if(d<0.9) f=Math.max(f,x.t/2); }
  return f;
}
function axisTarget(w, p){ return w.len==null ? len(w) : w.len + FACESIGN[faceOf(w)]*(faceAt(w,w.a,p) + faceAt(w,w.b,p)); }
function opGeom(o, p){
  const w=wallOf(o,p); if(!w) return null; const L=len(w); if(L<1e-6) return null;
  const k = w.len ? L/axisTarget(w,p) : 1;               // trazo por metro real
  const sw = Math.min((o.len||OPDEF[o.kind])*k, L*0.98);

function drawGrid(c){
  let step = 1; if(view.s<12) step=5; else if(view.s>90) step=0.5;
  const w0=s2w(0,0), w1=s2w(W,H); c.lineWidth=1;
  for(let pass=0; pass<2; pass++){

    c.beginPath();
    for(let x=Math.floor(w0.x/st)*st; x<=w1.x; x+=st){ const sx=Math.round(x*view.s+view.ox)+.5; c.moveTo(sx,0); c.lineTo(sx,H); }
    for(let y=Math.floor(w0.y/st)*st; y<=w1.y; y+=st){ const sy=Math.round(y*view.s+view.oy)+.5; c.moveTo(0,sy); c.lineTo(W,sy); }
    c.stroke();
  }
  c.fillStyle='rgba(0,0,0,.45)'; c.font='11px system-ui'; c.textAlign='right'; c.fillText('cuadrícula '+(step<1?step.toFixed(1):step)+' m', W-10, H-10); c.textAlign='left';
}
function upright(a){ if(a>Math.PI/2) a-=Math.PI; if(a<=-Math.PI/2) a+=Math.PI; return a; }

  c.lineWidth=4; c.strokeStyle='rgba(255,255,255,.95)'; c.lineJoin='round'; c.strokeText(txt,0,0);

function renderPlan(c, v, o){

  for(const w of order){
    const a=S(w.a), b=S(w.b);

    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
    if(isSel('wall',w.id)){ c.lineWidth=Math.max(6,w.t*v.s)+6; c.strokeStyle='rgba(15,111,222,.35)'; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
  }

    const g=opGeom(op,p); if(!g) continue; const T=wpx(g.w);
    const p1=S(g.p1), p2=S(g.p2); const nx=g.nx, ny=g.ny; const wPx=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const selOp=isSel('open',op.id); const col= selOp?'#0f6fde':'#1f2a37';
    c.lineCap='butt'; c.strokeStyle=bg; c.lineWidth=T+2; c.beginPath(); c.moveTo(p1.x,p1.y); c.lineTo(p2.x,p2.y); c.stroke();
    c.strokeStyle=col; c.lineWidth=1.5*k; c.beginPath();
    for(const q of [p1,p2]){ c.moveTo(q.x-nx*T/2,q.y-ny*T/2); c.lineTo(q.x+nx*T/2,q.y+ny*T/2); }
    c.stroke();
    if(op.kind==='win'){
      c.lineWidth=1.2*k; c.beginPath();
      for(const f of [-0.5,0,0.5]){ c.moveTo(p1.x+nx*T*f,p1.y+ny*T*f); c.lineTo(p2.x+nx*T*f,p2.y+ny*T*f); }
      c.stroke();
    } else if(op.kind==='door'){
      const fl=op.flip||0; const hinge= (fl&1)?p2:p1, other=(fl&1)?p1:p2; const sd=(fl&2)?-1:1;
      const le={x:hinge.x+nx*sd*wPx, y:hinge.y+ny*sd*wPx};

      c.lineWidth=1*k; c.setLineDash([4*k,3*k]); c.beginPath();

    } else {
      c.lineWidth=1*k; c.setLineDash([5*k,4*k]); c.beginPath();

      c.stroke(); c.setLineDash([]);

    const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x), ua=upright(ang); const ux2=-Math.sin(ua), uy2=Math.cos(ua);
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2; const off=T/2+11*k;
    haloText(c, op.name+' '+fmt(op.len), mx+ux2*off, my+uy2*off, ua, `700 ${11*k}px system-ui`, op.len!=null?'#15803d':'#d97706');
    if(selOp){
      const r=S(g.ref), e=g.refEdge==='p1'?p1:p2; const o2=T/2+28*k;
      c.strokeStyle='#0f6fde'; c.lineWidth=1.2*k; c.beginPath();

      c.stroke();
      haloText(c, 'dist. '+fmt(op.off), (r.x+e.x)/2+ux2*(o2+10*k), (r.y+e.y)/2+uy2*(o2+10*k), ua, `600 ${11*k}px system-ui`, '#0f6fde');
      c.fillStyle='#0f6fde'; c.beginPath(); c.arc(r.x,r.y,5*k,0,7); c.fill();

  // cotas de muros (en el tramo libre más largo, para no chocar con vanos)
  const gapsOf={}; for(const op of p.openings){ const g=opGeom(op,p); if(g) (gapsOf[op.wall]=gapsOf[op.wall]||[]).push([g.c-g.sw/2-0.15, g.c+g.sw/2+0.15]); }
  for(const w of p.walls){
    const a=S(w.a), b=S(w.b); const ang=Math.atan2(b.y-a.y,b.x-a.x), ua=upright(ang);
    const nx=-Math.sin(ua), ny=Math.cos(ua); const off=(wpx(w)/2+10*k);
    const Lw=len(w); let tm=0.5;
    if(gapsOf[w.id] && Lw>1e-6){
      const gs=gapsOf[w.id].sort((x,y)=>x[0]-y[0]); let s0=0, best=[0,0];
      for(const [g0,g1] of gs){ if(g0-s0>best[1]-best[0]) best=[s0,g0]; s0=Math.max(s0,g1); }
      if(Lw-s0>best[1]-best[0]) best=[s0,Lw];
      if(best[1]-best[0]>0.05) tm=(best[0]+best[1])/2/Lw;
    }
    const mx=a.x+(b.x-a.x)*tm, my=a.y+(b.y-a.y)*tm; const measured = w.len!=null;
    haloText(c, measured?fmt(w.len)+faceTag(w):'?', mx-nx*off, my-ny*off, ua, `700 ${13*k}px system-ui`, measured?'#15803d':'#d97706');
    if(o.names && v.s>22) haloText(c, w.name||'', mx-nx*(off+14*k), my-ny*(off+14*k), ua, `${10*k}px system-ui`, '#9ca3af');
  }
  // cotas libres
  for(const d of p.dims){
    const a=S(d.a), b=S(d.b); const sd=isSel('dim',d.id);
    const ang=Math.atan2(b.y-a.y,b.x-a.x), ua=upright(ang); const nx=-Math.sin(ang), ny=Math.cos(ang);
    c.strokeStyle=sd?'#0f6fde':'#7c3aed'; c.lineWidth=(sd?2.5:1.3)*k; c.setLineDash([6*k,4*k]);
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); c.setLineDash([]);
    const tk=6*k; c.beginPath();
    for(const q of [a,b]){ c.moveTo(q.x-nx*tk-Math.cos(ang)*tk*.7, q.y-ny*tk-Math.sin(ang)*tk*.7); c.lineTo(q.x+nx*tk+Math.cos(ang)*tk*.7, q.y+ny*tk+Math.sin(ang)*tk*.7); }
    c.stroke();
    const n2x=-Math.sin(ua), n2y=Math.cos(ua);
    haloText(c, d.len!=null?fmt(d.len)+faceTag(d):'?', (a.x+b.x)/2-n2x*9*k, (a.y+b.y)/2-n2y*9*k, ua, `700 ${12*k}px system-ui`, d.len!=null?'#7c3aed':'#d97706');
  }
  // recintos
  for(const l of p.labels){ const q=S(l); const sl=isSel('label',l.id);
    haloText(c, l.text, q.x, q.y, 0, `600 ${13*k}px system-ui`, sl?'#0f6fde':'#1f2a37');
    if(l.h!=null || sl) haloText(c, 'h = '+(l.h!=null?fmt(l.h):'?'), q.x, q.y+15*k, 0, `600 ${11*k}px system-ui`, l.h!=null?'#15803d':'#d97706'); }
  // marcadores de fotos
  for(const f of p.photos){
    if(f.x==null) continue; const q=S(f); const r=11*k;

    c.strokeStyle='#fff'; c.lineWidth=1.5*k; c.strokeRect(q.x-6*k,q.y-3.5*k,12*k,8*k); c.beginPath(); c.arc(q.x,q.y+0.5*k,2.5*k,0,7); c.stroke();
    const lx = f.dir!=null ? q.x-Math.cos(f.dir)*(r+12*k) : q.x+r+10*k, ly = f.dir!=null ? q.y-Math.sin(f.dir)*(r+12*k) : q.y;   // rótulo al lado opuesto de la flecha
    haloText(c, f.name, lx, ly, 0, `700 ${11*k}px system-ui`, '#1f2a37');
  }
  if(o.ends){ c.fillStyle='#0f6fde'; for(const w of p.walls) for(const q of [S(w.a),S(w.b)]){ c.beginPath(); c.arc(q.x,q.y,2.5,0,7); c.fill(); } }
  if(o.sel){
    const e=getEl(o.sel); if(e && e.a){ for(const q of [S(e.a),S(e.b)]){ c.fillStyle='#fff'; c.strokeStyle='#0f6fde'; c.lineWidth=2; c.beginPath(); c.arc(q.x,q.y,7,0,7); c.fill(); c.stroke(); } }
  }
}
function drawAim(c, q, dir, k, preview){

function countFields(p){

  for(const o of p.openings){ n+=2; if(o.len!=null) m++; if(o.off!=null) m++; }

}
function draw(){
  if(!P || !W) return;

  drawGrid(ctx);
  renderPlan(ctx, view, {sel, ends: tool!=='sel' && tool!=='vano' && tool!=='foto', names:true});

    const a=w2s(draft.a), b=w2s(draft.b);

    else { ctx.strokeStyle= draft.kind==='ext'?'rgba(43,43,43,.6)':'rgba(122,127,135,.6)'; ctx.lineCap='square';

/* ============ Enganches ============ */
function endpoints(exclPts){ const r=[]; for(const w of P.walls) r.push(w.a,w.b); for(const d of P.dims) r.push(d.a,d.b); return exclPts? r.filter(p=>!exclPts.includes(p)) : r; }
function rayHits(f, ux, uy, exclW){
  const hits=[];
  for(const w of P.walls){
    if(exclW && exclW.has(w)) continue;
    const ex=w.b.x-w.a.x, ey=w.b.y-w.a.y, den=ux*ey-uy*ex; if(Math.abs(den)<1e-9) continue;
    const ax=w.a.x-f.x, ay=w.a.y-f.y; const t=(ax*ey-ay*ex)/den, u=(ax*uy-ay*ux)/den;
    if(u>=-1e-6 && u<=1+1e-6 && t>0.05) hits.push({t, w:w.id});
  }
  return hits;
}
function nearestOnWall(sx, sy, R, exclW){
  let best=null, bd=R;
  for(const w of P.walls){
    if(exclW && exclW.has(w)) continue;
    const a=w2s(w.a), b=w2s(w.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y);
    if(r.d<bd){ bd=r.d; best={x:w.a.x+(w.b.x-w.a.x)*r.t, y:w.a.y+(w.b.y-w.a.y)*r.t, w, t:r.t}; }
  }
  return best;
}
function ptOf(s){ const q={x:s.x, y:s.y}; if(s.w!=null && (s.kind==='on'||s.kind==='int')) q.on=s.w; return q; }
function hostOf(q){ if(q.on==null) return null; const h=P.walls.find(w=>w.id===q.on); return h && len(h)>1e-6 ? h : null; }
function reattach(skipHosts){
  // los extremos amarrados a un muro (encuentros en T) se mantienen sobre él cuando ese muro se mueve
  for(const w of P.walls) for(const q of [w.a,w.b]){
    const h=hostOf(q); if(!h || h===w || (skipHosts && skipHosts.has(w))) continue;
    const other = q===w.a ? w.b : w.a; const dx=q.x-other.x, dy=q.y-other.y;
    const hx=h.b.x-h.a.x, hy=h.b.y-h.a.y, den=dx*hy-dy*hx; let nx, ny;
    if(Math.abs(den)>1e-9){ const t=((h.a.x-other.x)*hy-(h.a.y-other.y)*hx)/den; nx=other.x+dx*t; ny=other.y+dy*t; }   // sigue su propia dirección hasta el eje del muro
    else { const L2=hx*hx+hy*hy; const t=((q.x-h.a.x)*hx+(q.y-h.a.y)*hy)/L2; nx=h.a.x+hx*t; ny=h.a.y+hy*t; }
    if(Math.abs(nx-q.x)>1e-9 || Math.abs(ny-q.y)>1e-9) moveCoincident(q, nx, ny);
  }
}
function snapPoint(sx, sy, from, exclPts, exclW){
  const R=22; let best=null, bd=R;
  for(const p of endpoints(exclPts)){ const q=w2s(p); const d=Math.hypot(q.x-sx,q.y-sy); if(d<bd){ bd=d; best={x:p.x,y:p.y,kind:'end'}; } }
  if(best) return best;
  const w=s2w(sx,sy);
  if(from && db.settings.ortho){
    const dx=w.x-from.x, dy=w.y-from.y; const ang=Math.atan2(dy,dx); const step=Math.PI/4; const sn=Math.round(ang/step)*step;
    if(Math.abs(ang-sn)<0.15){
      const ux=Math.cos(sn), uy=Math.sin(sn); const proj=dx*ux+dy*uy;
      let bh=null, bdh=R/view.s;
      for(const hh of rayHits(from,ux,uy,exclW)){ if(Math.abs(hh.t-proj)<bdh){ bdh=Math.abs(hh.t-proj); bh=hh; } }
      if(bh!=null) return {x:from.x+ux*bh.t, y:from.y+uy*bh.t, kind:'int', w:bh.w};
      const L=Math.round(proj/0.05)*0.05; return {x:from.x+ux*L, y:from.y+uy*L, kind:'ortho'};
    }
  }
  const on=nearestOnWall(sx,sy,16,exclW); if(on) return {x:on.x, y:on.y, kind:'on', w:on.w.id};
  return {x:Math.round(w.x/0.05)*0.05, y:Math.round(w.y/0.05)*0.05, kind:'grid'};
}

/* ============ Selección ============ */
function hitTest(sx, sy){
  let best=null, bd=Infinity;
  for(const f of P.photos){ if(f.x==null) continue; const q=w2s(f); const d=Math.hypot(q.x-sx,q.y-sy); if(d<20 && d<bd){ bd=d; best={kind:'photo',id:f.id}; } }
  if(best) return best;
  for(const l of P.labels){ const q=w2s(l); const d=Math.hypot(q.x-sx,q.y-sy); if(d<26 && d<bd){ bd=d; best={kind:'label',id:l.id}; } }
  if(best) return best;
  for(const o of P.openings){ const g=opGeom(o); if(!g) continue; const a=w2s(g.p1), b=w2s(g.p2); const r=segDist(sx,sy,a.x,a.y,b.x,b.y); if(r.d<Math.max(18,g.w.t*view.s/2+8) && r.d<bd){ bd=r.d; best={kind:'open',id:o.id,field:'len'}; } }
  if(best) return best;
  for(const d of P.dims){ const a=w2s(d.a), b=w2s(d.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y); if(r.d<18 && r.d<bd){ bd=r.d; best={kind:'dim',id:d.id}; } }
  for(const w of P.walls){ const a=w2s(w.a), b=w2s(w.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y); const tol=Math.max(18, w.t*view.s/2+8); if(r.d<tol && r.d<bd){ bd=r.d; best={kind:'wall',id:w.id}; } }
  return best;
}
function selCenter(){
  const e=getEl(sel); if(!e) return null;

  if(e.a) return w2s({x:(e.a.x+e.b.x)/2, y:(e.a.y+e.b.y)/2});
  return w2s(e);
}
function ensureVisible(){

function moveCoincident(o, nx, ny){ const ox=o.x, oy=o.y; for(const z of endpoints()) if(Math.abs(z.x-ox)<1e-6 && Math.abs(z.y-oy)<1e-6){ z.x=nx; z.y=ny; } }
function handlePending(sx, sy){
  const w=P.walls.find(x=>x.id===pending.id); const type=pending.type; pending=null; setTool('sel'); if(!w) return;
  if(type==='split'){
    const a=w2s(w.a), b=w2s(w.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y);
    if(r.d>30){ toast('Toca sobre el muro '+w.name); return; }

  }
  const h=hitTest(sx,sy); const o=h && h.kind==='wall' ? P.walls.find(x=>x.id===h.id) : null;

  const L=len(w), ux=(w.b.x-w.a.x)/L, uy=(w.b.y-w.a.y)/L;
  for(const end of ['a','b']){
    const q=o[end]; let t=(q.x-w.a.x)*ux+(q.y-w.a.y)*uy;
    // si ese extremo topaba con otro muro, se mantiene sobre él (intersección de ejes)
    const host=wallsAt(q).find(h=>h!==o && h!==w && !near(h.a,q,1e-6) && !near(h.b,q,1e-6));

function splitWall(w, t){

  const w2={...w, id:P.seq++, name:nextName(w.type==='ext'?'M':'T'), a:{...m}, b:w.b, len:null};
  for(const o of P.openings.filter(o=>o.wall===w.id)){
    const g=opGeom(o); const tt=g? g.c/g.L : o.t;
    if(tt>t){ o.wall=w2.id; o.t=(tt-t)/(1-t); if(o.ref!=='b') o.off=null; } else { o.t=tt/t; if(o.ref==='b') o.off=null; }

  w.b={...m}; const had=w.len!=null; w.len=null;
  P.walls.splice(P.walls.indexOf(w)+1, 0, w2);

function fitStroke(e){

  const ux=(e.b.x-e.a.x)/L, uy=(e.b.y-e.a.y)/L; const dx=e.a.x+ux*T-e.b.x, dy=e.a.y+uy*T-e.b.y; const ox=e.b.x, oy=e.b.y;
  for(const p of endpoints()) if(Math.abs(p.x-ox)<1e-6 && Math.abs(p.y-oy)<1e-6){ p.x+=dx; p.y+=dy; }
  reattach(); save(); draw(); toast('Trazo ajustado a '+fmt(e.len)+' m');
}

/* ============ Rectificar planta con las medidas ============ */
function solveLin(M, v){
  const n=v.length; const A=M.map((r,i)=>{ const x=Array.from(r); x.push(v[i]); return x; });
  for(let c=0;c<n;c++){
    let piv=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[piv][c])) piv=r;
    if(Math.abs(A[piv][c])<1e-12) return null; [A[c],A[piv]]=[A[piv],A[c]];
    for(let r=c+1;r<n;r++){ const f=A[r][c]/A[c][c]; if(f===0) continue; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; }
  }
  const x=new Float64Array(n); for(let r=n-1;r>=0;r--){ let sum=A[r][n]; for(let k=r+1;k<n;k++) sum-=A[r][k]*x[k]; x[r]=sum/A[r][r]; } return x;
}
function cornerPt(pt, toward, p, mode){
  // punto de la cara (interior: hacia el otro extremo; exterior: hacia afuera) de una esquina o encuentro
  const sgn=FACESIGN[mode||'int']; if(!sgn) return {x:pt.x, y:pt.y};
  const dirs=[]; let ox=0, oy=0;
  for(const w of wallsAt(pt,p)){
    const L=len(w); const nx=-(w.b.y-w.a.y)/L, ny=(w.b.x-w.a.x)/L;
    if(dirs.some(d=>Math.abs(d.nx*nx+d.ny*ny)>0.9)) continue; dirs.push({nx,ny});
    const sg=(Math.sign((toward.x-pt.x)*nx+(toward.y-pt.y)*ny)||1)*sgn; ox+=nx*sg*w.t/2; oy+=ny*sg*w.t/2;
  }
  return {x:pt.x+ox, y:pt.y+oy};
}
function isLocator(d, p){
  // cota recta paralela a un muro: se usa como medida para ubicar (no como control)
  const L=len(d); if(L<1e-6) return false; const ux=(d.b.x-d.a.x)/L, uy=(d.b.y-d.a.y)/L;
  return (p||P).walls.some(w=>{ const Lw=len(w); return Lw>1e-6 && Math.abs(ux*(w.b.x-w.a.x)/Lw+uy*(w.b.y-w.a.y)/Lw)>0.996; });
}
function diagChecks(p){
  p=p||P; return p.dims.filter(d=>d.len!=null && !isLocator(d,p)).map(d=>{ const a=cornerPt(d.a,d.b,p,faceOf(d)), b=cornerPt(d.b,d.a,p,faceOf(d)); const got=Math.hypot(b.x-a.x,b.y-a.y); return {d, got, delta:got-d.len}; });

function squareDirs(walls){
  // orientación dominante (módulo 90°) ponderada por largo; endereza ángulos casi rectos
  // se elige el ángulo (módulo 90°) que más largo de muros comparte; un muro chueco no arrastra al resto
  const D=Math.PI/180, m90=a=>{ let r=a%(Math.PI/2); if(r<0) r+=Math.PI/2; return r; };
  const dif=(a,b)=>{ let d=Math.abs(m90(a)-m90(b)); return Math.min(d, Math.PI/2-d); };
  const angs=walls.map(w=>({a:Math.atan2(w.b.y-w.a.y,w.b.x-w.a.x), L:len(w)}));
  let best=null, bs=-1; for(const c of angs){ const sc=angs.reduce((s2,o)=>s2+(dif(o.a,c.a)<0.5*D?o.L:0),0); if(sc>bs){ bs=sc; best=c.a; } }
  let sx=0, sy=0; for(const o of angs) if(dif(o.a,best)<0.5*D){ sx+=o.L*Math.cos(4*o.a); sy+=o.L*Math.sin(4*o.a); }
  const th=Math.atan2(sy,sx)/4, dir={}; let fixed=0;
  for(const w of walls){
    let a=Math.atan2(w.b.y-w.a.y,w.b.x-w.a.x); const rel=a-th;
    if(db.settings.square!==false){
      const k90=Math.round(rel/(Math.PI/2)), d90=Math.abs(rel-k90*Math.PI/2);
      const k45=Math.round(rel/(Math.PI/4)), d45=Math.abs(rel-k45*Math.PI/4);
      if(d90<6*D){ if(d90>0.05*D) fixed++; a=th+k90*Math.PI/2; }
      else if(d45<3*D){ if(d45>0.05*D) fixed++; a=th+k45*Math.PI/4; }
    }
    dir[w.id]={ux:Math.cos(a), uy:Math.sin(a)};
  }
  // muros alineados en un mismo eje: misma dirección
  for(const al of P.aligns){ if(dir[al.a] && dir[al.b]){ const A=dir[al.a], B=dir[al.b]; const sg=Math.sign(A.ux*B.ux+A.uy*B.uy)||1; dir[al.b]={ux:A.ux*sg, uy:A.uy*sg}; } }

}
function rectify(){

  const nodes=[], idx=new Map();
  for(const q of pts){ let k=nodes.findIndex(n=>near(n,q)); if(k<0){ k=nodes.length; nodes.push({x:q.x,y:q.y}); } idx.set(q,k); }

  const row=(co,rhs,w)=>{ for(const [i,ci] of co){ v[i]+=w*ci*rhs; for(const [j,cj] of co) M[i][j]+=w*ci*cj; } };
  const info=[];
  for(const w of walls){
    const i=idx.get(w.a), j=idx.get(w.b); if(i===j) continue;
    const {ux,uy}=dir[w.id], nx=-uy, ny=ux;
    row([[2*j,nx],[2*j+1,ny],[2*i,-nx],[2*i+1,-ny]], 0, 1e4);                 // dirección del croquis (enderezada)
    const target=axisTarget(w);
    row([[2*j,ux],[2*j+1,uy],[2*i,-ux],[2*i+1,-uy]], target, w.len!=null?1000:0.05); // largo medido (o el del croquis)

      const r=segDist(q.x,q.y,w.a.x,w.a.y,w.b.x,w.b.y);
      if(hostIds[k].has(w.id) || (r.d<0.05 && r.t>0.001 && r.t<0.999)){ const nx=-dir[w.id].uy, ny=dir[w.id].ux; row([[2*k,nx],[2*k+1,ny],[2*i,-nx],[2*i+1,-ny]], 0, 1e4);
        // sin otra medida, el encuentro conserva su proporción a lo largo del muro
        row([[2*k,1],[2*i,-(1-r.t)],[2*j,-r.t]], 0, 0.05); row([[2*k+1,1],[2*i+1,-(1-r.t)],[2*j+1,-r.t]], 0, 0.05); } } }
  // cotas libres paralelas a un muro (p. ej. ubicación de un tabique) también se usan como medida
  for(const d of P.dims){
    if(d.len==null) continue; const L=len(d); if(L<1e-6) continue; const ux=(d.b.x-d.a.x)/L, uy=(d.b.y-d.a.y)/L;
    if(!isLocator(d)) continue;
    const i=idx.get(d.a), j=idx.get(d.b); if(i===j) continue;
    const ca=cornerPt(d.a,d.b,P,faceOf(d)), cb=cornerPt(d.b,d.a,P,faceOf(d)); const corr=((cb.x-d.b.x)-(ca.x-d.a.x))*ux+((cb.y-d.b.y)-(ca.y-d.a.y))*uy;
    row([[2*j,ux],[2*j+1,uy],[2*i,-ux],[2*i+1,-uy]], d.len-corr, 1000);
  }
  // muros en el mismo eje estructural
  for(const al of P.aligns){
    const A=P.walls.find(w=>w.id===al.a), B=P.walls.find(w=>w.id===al.b); if(!A||!B||!dir[A.id]) continue;
    const nx=-dir[A.id].uy, ny=dir[A.id].ux, i=idx.get(A.a);
    for(const q of [B.a,B.b]){ const k=idx.get(q); if(k!==i) row([[2*k,nx],[2*k+1,ny],[2*i,-nx],[2*i+1,-ny]], 0, 1e4); }

  for(let k=0;k<N;k++){ row([[2*k,1]],nodes[k].x,0.001); row([[2*k+1,1]],nodes[k].y,0.001); }

  for(const q of pts){ const k=idx.get(q); q.x=x[2*k]; q.y=x[2*k+1]; }
  const bad=info.filter(it=>it.w.len!=null && Math.abs(len(it.w)-it.target)>0.02).map(it=>({w:it.w, got:len(it.w)-it.faces}));
  P.dirty=false; P.rectified=true; save(); fitView(); renderProps(); draw();
  return {bad, fixed:SQ.fixed, aligns:P.aligns.length, diag:diagChecks(), unmeasured:walls.filter(w=>w.len==null).length, measured:walls.filter(w=>w.len!=null).length};
}

/* ============ Bluetooth Bosch GLM ============ */
function setBt(state){ bt.state=state; $$('.btbtn').forEach(b=>{ b.classList.toggle('on',state==='on'); b.classList.toggle('busy',state==='busy'); }); renderProps(); if(PE.open) pedProps(); }
async function btWrite(bytes){
  const d=new Uint8Array(bytes);
  try{ if(bt.ch.writeValueWithoutResponse) await bt.ch.writeValueWithoutResponse(d); else await bt.ch.writeValue(d); }
  catch(e){ try{ await bt.ch.writeValueWithResponse(d); }catch(e2){} }
}
function parseBosch(dv){
  // Paquete de medida: C0 55 10 06 ... distancia float32 little-endian desde el byte 7 (metros)
  if(dv.byteLength>=11 && dv.getUint8(0)===0xC0 && dv.getUint8(1)===0x55 && dv.getUint8(2)===0x10 && dv.getUint8(3)===0x06){
    const m=dv.getFloat32(7,true); if(isFinite(m) && m>0.01 && m<300) return m;
  }
  return null;
}
function onBtData(ev){
  const dv=ev.target.value; let hex=''; for(let i=0;i<dv.byteLength;i++) hex+=dv.getUint8(i).toString(16).padStart(2,'0')+' ';
  bt.lastRaw=hex.trim();
  const m=parseBosch(dv); if(m==null) return;
  const now=Date.now(); if(bt.lastV!=null && Math.abs(m-bt.lastV)<1e-6 && now-bt.lastT<500) return;
  bt.lastV=m; bt.lastT=now; onMeasure(m);
}
async function btConnect(){
  if(!navigator.bluetooth){ btHelp(true); return; }
  try{
    setBt('busy');
    if(!bt.dev){
      bt.dev = await navigator.bluetooth.requestDevice({filters:[{services:[SVC]},{namePrefix:'GLM'},{namePrefix:'Bosch'}], optionalServices:[SVC]});
      bt.dev.addEventListener('gattserverdisconnected', ()=>{ setBt('off'); toast('Huincha desconectada. Toca «Láser» para reconectar.', 3000); });
    }
    const srv=await bt.dev.gatt.connect();
    const svc=await srv.getPrimaryService(SVC);
    const ch=await svc.getCharacteristic(CHR);
    bt.ch=ch; await ch.startNotifications();
    if(!ch._hooked){ ch.addEventListener('characteristicvaluechanged', onBtData); ch._hooked=true; }
    await btWrite([0xC0,0x55,0x02,0x01,0x00,0x1A]);   // activa el envío automático de cada medida
    setBt('on'); toast('Huincha conectada ✔'); vibrate(60); keepAwake();
  }catch(e){
    setBt('off');
    if(e && e.name==='NotFoundError') return;
    toast('No se pudo conectar: '+(e && e.message || e), 4000);
  }
}

cv.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return; const p=local(e); pts.set(e.pointerId,p);

    const [p1,p2]=[...pts.values()]; const d=Math.hypot(p1.x-p2.x,p1.y-p2.y); const m={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};

  }

    const q=w2s(gest.f); gest.f.dir=Math.atan2(p.y-q.y, p.x-q.x); draw(); return;
  }

  }

    gest.moved=true; const w=wallOf(gest.op); if(!w) return; const a=w2s(w.a), b=w2s(w.b);

});
function endPointer(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(!gest) return;
  if(gest.type==='pinch'){ if(pts.size===0) gest=null; else { const p=[...pts.values()][0]; gest={type:'one',start:p,moved:true,v0:{...view}}; draft=null; } return; }
  if(pts.size>0) return;
  const g=gest; gest=null;
  if(g.type==='aim'){ if(!g.moved){ undoStack.pop(); openPhoto(g.f.id); } else { save(); draw(); toast(g.f.name+': dirección actualizada'); } return; }
  if(g.foto && g.moved && aimDraft){ const a=aimDraft; aimDraft=null; draw(); askPhoto({x:a.x, y:a.y, dir:a.dir}); return; }
  aimDraft=null;
  if(g.type==='drag'||g.type==='slide'||g.type==='move'){
    if(!g.moved){ undoStack.pop(); if(pending){ handlePending(g.start.x,g.start.y); return; } }
    save(); draw(); return; }
  if(draft){
    const d=draft; draft=null;
    if(!g.moved || len(d)*view.s<12 || len(d)<0.05){ select(hitTest(g.start.x,g.start.y)); return; }
    pushUndo();
    if(d.kind==='dim'){ const el={id:P.seq++, name:nextName('C'), a:d.a, b:d.b, len:null}; P.dims.push(el); sel={kind:'dim',id:el.id}; }
    else { const el={id:P.seq++, type:d.kind, name:nextName(d.kind==='ext'?'M':'T'), a:d.a, b:d.b, t:d.kind==='ext'?db.settings.tExt:db.settings.tTab, len:null}; P.walls.push(el); sel={kind:'wall',id:el.id}; }
    save(); renderProps(); ensureVisible(); draw(); return;
  }
  if(g.moved) return;
  if(pending){ handlePending(g.start.x,g.start.y); return; }
  const h=hitTest(g.start.x,g.start.y);
  if(tool==='vano'){
    if(h && (h.kind==='open'||h.kind==='photo')){ select(h); return; }
    const on=nearestOnWall(g.start.x,g.start.y,Math.max(22, 0.15*view.s));
    if(!on){ toast('Toca sobre un muro o tabique'); return; }
    pushUndo(); const el={id:P.seq++, kind:opKind, name:nextName(OPPRE[opKind]), wall:on.w.id, t:on.t, len:null, off:null, h:null, ref:'a', flip:0};
    P.openings.push(el); sel={kind:'open',id:el.id,field:'len'}; save(); renderProps(); ensureVisible(); draw(); return;
  }
  if(tool==='txt'){
    if(h && h.kind==='label'){ select(h); return; }
    const w=s2w(g.start.x,g.start.y);
    askText('Nombre del recinto','', 'Ej: Dormitorio 1, Baño, Cocina').then(t=>{ if(!t) return; pushUndo(); const el={id:P.seq++, x:w.x, y:w.y, text:t, h:null}; P.labels.push(el); sel={kind:'label', id:el.id}; save(); renderProps(); ensureVisible(); draw(); });
    return;
  }
  if(tool==='foto'){
    if(h && h.kind==='photo'){ select(h); return; }
    const w=s2w(g.start.x,g.start.y); askPhoto({x:w.x, y:w.y}); return;
  }
  select(h);
}

function buildPNG(){
  return new Promise(res=>{
    const b=bounds(); if(!b){ res(null); return; }
    const bw=Math.max(b.x1-b.x0,1), bh=Math.max(b.y1-b.y0,1);
    const k=2, maxSide=2200, pad=120; const s=Math.min(160, (maxSide-2*pad)/Math.max(bw,bh));
    const cw=Math.round(bw*s+2*pad), head=150; const ch=Math.round(bh*s+2*pad+head);
    const c=document.createElement('canvas'); c.width=cw; c.height=ch; const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);
    x.fillStyle='#1f2a37'; x.font='700 40px system-ui'; x.fillText(P.name||'Levantamiento', pad, 64);
    x.font='26px system-ui'; x.fillStyle='#4b5563'; x.fillText([P.address,P.owner,P.date].filter(Boolean).join('  ·  '), pad, 104);
    x.font='italic 20px system-ui'; x.fillText('Croquis de levantamiento — medidas en metros — trazo aproximado', pad, 136);
    renderPlan(x, {s, ox:pad-b.x0*s, oy:head+pad-b.y0*s}, {k, names:true, bg:'#fff'});
    c.toBlob(res,'image/png');
  });
}

const PDF_LIBS=['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'];
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('sin conexión')); document.head.appendChild(s); }); }
async function ensurePdf(){
  if(!(window.jspdf && window.jspdf.jsPDF)) await loadScript(PDF_LIBS[0]);
  if(!window.jspdf.jsPDF.API.autoTable) await loadScript(PDF_LIBS[1]);
  return window.jspdf.jsPDF;
}
function refLabel(o){
  // nombre del muro que llega a la esquina desde donde se midió la distancia
  const w=wallOf(o); if(!w) return ''; const rp=o.ref==='b'?w.b:w.a;
  const n=P.walls.find(x=>x!==w && [x.a,x.b].some(q=>Math.abs(q.x-rp.x)<1e-6 && Math.abs(q.y-rp.y)<1e-6));
  return n ? 'esquina con '+n.name : (o.ref==='b'?'extremo final':'extremo inicial');
}
function planImage(boxW, boxH){
  const b=bounds(); if(!b) return null;
  const pxmm=10, margin=14;
  const bw=Math.max(b.x1-b.x0,0.5), bh=Math.max(b.y1-b.y0,0.5);
  const SC=[20,25,50,75,100,125,150,200,250,300,400,500,750,1000,1500,2000];
  let den=SC.find(d=>bw*1000/d+2*margin<=boxW && bh*1000/d+2*margin<=boxH)||null;
  const mmPerM = den ? 1000/den : Math.min((boxW-2*margin)/bw, (boxH-2*margin)/bh);
  const s=mmPerM*pxmm, cw=Math.round(boxW*pxmm), ch=Math.round(boxH*pxmm);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);
  renderPlan(x, {s, ox:cw/2-(b.x0+bw/2)*s, oy:ch/2-(b.y0+bh/2)*s}, {k:pxmm*0.21, names:true, bg:'#fff'});
  return {data:c.toDataURL('image/png'), den, mmPerM};
}
async function photoImage(ph){
  const blob=await idb.get(ph.id); if(!blob) return null;
  const url=URL.createObjectURL(blob); const img=await loadImage(url);
  const c=document.createElement('canvas'); c.width=ph.w; c.height=ph.h; const x=c.getContext('2d');
  renderPhoto(x, {s:1,ox:0,oy:0}, ph, img, {k:Math.max(1, ph.w/700)});
  URL.revokeObjectURL(url); return c.toDataURL('image/jpeg',0.85);
}

  $('#mAuthor').onchange=e=>{ db.settings.author=e.target.value.trim(); save(); };
  $('#xPDF').onclick=async()=>{
    if(!P.walls.length && !P.photos.length) return toast('Aún no hay nada para el informe');
    if(P.walls.some(w=>w.len!=null) && !(P.rectified && P.dirty===false)){
      const go=await ask('Planta sin rectificar', 'La planta todavía es el croquis a mano. ¿Rectificarla con las medidas para que el informe quede a escala?', 'Rectificar');
      if(go){ const r=rectify(); if(r && (r.bad.length || r.diag.some(c=>Math.abs(c.delta)>0.03))) toast('Rectificada. Revisa los avisos en ☰ → Rectificar.', 4000); }
    }
    toast('Generando informe…', 6000);
    try{ const b=await buildReport(); shareOrDownload(b, safeName()+'_informe.pdf'); }
    catch(err){ toast(String(err&&err.message).includes('conexión') ? 'Para generar el PDF necesitas internet (se descarga el generador).' : 'No se pudo generar el informe: '+(err&&err.message||err), 5000); }
  };
  $('#mOwner').onchange=e=>{ P.owner=e.target.value.trim(); save(); updateHeader(); };
  $('#sExt').onchange=e=>{ const v=num(e.target.value); if(v>0){ db.settings.tExt=v; save(); } };
  $('#sTab').onchange=e=>{ const v=num(e.target.value); if(v>0){ db.settings.tTab=v; save(); } };
  $('#sOrtho').onchange=e=>{ db.settings.ortho=e.target.checked; save(); orthoLabel(); };
  $('#sSq').onchange=e=>{ db.settings.square=e.target.checked; P.dirty=true; save(); };
  $('#sAuto').onchange=e=>{ db.settings.auto=e.target.checked; save(); };
  $('#sFace').onchange=e=>{ db.settings.faceDef=e.target.value; P.dirty=true; save(); draw(); };
  $('#mRect').onclick=()=>{ closeSheet(); showRectify(rectify()); };
  $('#mRenum').onclick=()=>{ renumber(); openMenu(); };
  $('#mClose').onclick=closeSheet;
  $('#xDXF').onclick=()=>{ if(!P.walls.length&&!P.dims.length) return toast('Aún no hay nada dibujado'); shareOrDownload(new Blob([buildDXF()],{type:'application/dxf'}), safeName()+'.dxf'); };
  $('#xPNG').onclick=async()=>{ const b=await buildPNG(); if(!b) return toast('Aún no hay nada dibujado'); shareOrDownload(b, safeName()+'.png'); };
  $('#xCSV').onclick=()=>shareOrDownload(new Blob([buildCSV()],{type:'text/csv'}), safeName()+'_medidas.csv');
  $('#xJSON').onclick=async()=>{ toast('Preparando respaldo…'); shareOrDownload(new Blob([await buildBackup()],{type:'application/json'}), safeName()+'_respaldo.json'); };
  $('#mPhoto').onclick=()=>askPhoto(null);
  $('#mNew').onclick=async()=>{ const n=await askText('Nuevo levantamiento','', 'Ej: Regularización Cienfuegos 1498'); if(n) newProject(n); };
  $('#mImp').onclick=()=>$('#fileIn').click();
  $$('[data-ph]').forEach(b=>b.onclick=()=>{ closeSheet(); openPhoto(b.dataset.ph); });
  $$('[data-open]').forEach(b=>b.onclick=()=>{ openProject(b.dataset.open); closeSheet(); });
  $$('[data-del]').forEach(b=>b.onclick=async()=>{
    const p=db.projects.find(x=>x.id===b.dataset.del); if(!p) return;
    const ok=await ask('Eliminar levantamiento', `Se borrará «${p.name}» y sus fotos de este teléfono. No se puede deshacer.`, 'Eliminar', true);
    if(!ok){ openMenu(); return; }
    for(const ph of (p.photos||[])){ try{ await idb.del(ph.id); }catch(e){} }
    db.projects=db.projects.filter(x=>x.id!==p.id);
    if(p.id===P.id){ if(db.projects.length) openProject(db.projects[0].id); else newProject('Levantamiento'); }
    save(); openMenu();
  });
}
$('#menuBtn').onclick=openMenu; $('#ptitle').onclick=openMenu;
$('#fileIn').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); const p=normalize(d.project||d); if(!Array.isArray(p.walls)) throw 0;
    p.id='p'+Date.now(); const imgs=d.images||{};
    for(const ph of p.photos){
      const nid='ph'+Date.now()+Math.floor(Math.random()*100000);
      if(imgs[ph.id]){ const blob=await (await fetch(imgs[ph.id])).blob(); await idb.put(nid, blob); }
      ph.id=nid;
    }
    db.projects.unshift(p); openProject(p.id); closeSheet(); toast('Respaldo importado ✔');
  }catch(err){ toast('Ese archivo no es un respaldo válido'); }
};

/* ============ Inicio ============ */
load();
window.addEventListener('resize', resize);
resize();
if(db.projects.length) openProject(db.current||db.projects[0].id); else newProject('Levantamiento');
setOpKind('door'); setTool('ext'); orthoLabel();
window.__test = {get P(){return P}, PE, onMeasure, parseBosch, buildDXF, buildCSV, buildPNG, buildBackup, buildPhotoJPG, buildReport, rectify, renumber, diagChecks, axisTarget, select, setTool, openPhoto, idb, get view(){return view}};
</script>
</body>
</html>

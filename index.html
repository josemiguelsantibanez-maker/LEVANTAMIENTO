<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1f2a37">
<meta name="mobile-web-app-capable" content="yes">
<title>Levantamiento — Croquis con láser</title>
<style>
:root{--bg:#f4f1ea;--ink:#1f2a37;--muted:#6b7280;--acc:#0f6fde;--ok:#15803d;--warn:#d97706;--danger:#b91c1c;--line:#d6d3cc;--dim:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--ink);color:#fff}
header .title{flex:1;min-width:0;cursor:pointer}
header .title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .title span{font-size:12px;opacity:.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:#e7e4dc;color:var(--ink);cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#fff}
button.danger{background:#fde8e8;color:var(--danger)}
button.ghost{background:transparent}
.hbtn{background:rgba(255,255,255,.12);color:#fff;padding:8px 10px;font-size:14px;white-space:nowrap}
.btbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ca3af;margin-right:6px;vertical-align:middle}
.btbtn.on .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.btbtn.busy .dot{background:#f59e0b}
.last{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:56px;text-align:right}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:10px;top:44px;right:120px;font-size:12px;color:var(--muted);pointer-events:none;line-height:1.35}
.pill{position:absolute;right:10px;top:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.fab{position:absolute;right:10px;top:40px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
#vanoBar{position:absolute;left:10px;top:44px;display:none}
.tools{display:flex;gap:2px;padding:6px 4px;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tool{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;background:transparent;min-width:40px}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.active{background:var(--ink);color:#fff}
.sep{width:1px;background:var(--line);margin:4px 2px;flex:0 0 1px}
.props{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;display:none;z-index:5}
.props .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.props .row+.row{margin-top:8px}
.props .name{font-weight:700;font-size:15px}
.props .sub{font-size:12px;color:var(--muted)}
.props .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.props .val.miss{color:var(--warn)}
.props .val.okv{color:var(--ok)}
.props input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:84px;font-variant-numeric:tabular-nums}
.props input.wide{width:100%;flex:1}
.props input.tgt{border-color:var(--acc);box-shadow:0 0 0 2px rgba(15,111,222,.25)}
.props label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.props button{padding:8px 10px;font-size:13px}
.seg{display:inline-flex;background:#e7e4dc;border-radius:10px;padding:2px}
.seg button{background:transparent;padding:6px 10px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.waiting{font-size:12px;color:var(--acc)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:60}
#toast.show{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.sheet .f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.sheet .f input{font:inherit;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:10px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .plist .it{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.sheet .plist .it.cur{border-color:var(--acc);background:#eef5ff}
.sheet .plist .it div{flex:1;min-width:0}
.sheet .plist .it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .plist .it small{color:var(--muted)}
.sheet .tg{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px}
.sheet .tg input{width:22px;height:22px}
.sheet p{font-size:14px;line-height:1.45;margin:6px 0}
.sheet code{background:#f1efe9;padding:1px 4px;border-radius:4px;font-size:12px;word-break:break-all}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.big{display:block;width:100%;margin-bottom:8px;padding:14px;font-size:15px}
#ped{position:fixed;inset:0;z-index:30;background:#111;display:none}
#ped.show{display:flex}
#ped .stage{background:#111}
#ped .hint{color:#cbd5e1}
#pedName{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;padding:4px 2px}
</style>
</head>
<body>
<!-- ============ PLANO ============ -->
<div class="app" id="planApp">
  <header>
    <div class="title" id="ptitle"><b id="pname">Levantamiento</b><span id="paddr">Toca para datos, proyectos y exportar</span></div>
    <div class="last" title="Última medida">—</div>
    <button class="hbtn btbtn"><span class="dot"></span>Láser</button>
    <button class="hbtn" id="menuBtn" aria-label="Menú">☰</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="pill" id="count">0/0</div>
    <button class="fab" id="lvBtn" style="left:10px;right:auto;top:8px;font-weight:600">▤ 1er nivel</button>
    <button class="fab" id="fitBtn">⤢ Encuadrar</button>
    <button class="fab" id="orthoBtn" style="top:72px"></button>
    <div id="vanoBar" class="seg"><button data-op="door">Puerta</button><button data-op="win">Ventana</button><button data-op="fwin">Ventanal</button><button data-op="gap">Vano</button></div>
    <div class="props" id="props"></div>
  </div>
  <nav class="tools">
    <button class="tool" data-tool="ext"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" fill="currentColor"/></svg>Muro</button>
    <button class="tool" data-tool="tab"><svg viewBox="0 0 24 24"><rect x="3" y="10.5" width="18" height="3" fill="currentColor"/></svg>Tabique</button>
    <button class="tool" data-tool="vano"><svg viewBox="0 0 24 24"><path d="M2 20h5M17 20h5M7 20V6a10 10 0 0110 10v4"/></svg>Vano</button>
    <button class="tool" data-tool="col"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" fill="currentColor"/><path d="M3 12h4M17 12h4"/></svg>Pilar</button>
    <button class="tool" data-tool="dim"><svg viewBox="0 0 24 24"><path d="M4 18L20 6M4 14v8M20 2v8"/></svg>Cota</button>
    <button class="tool" data-tool="txt"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>Texto</button>
    <button class="tool" data-tool="foto"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button>
    <button class="tool" data-tool="sel"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Elegir</button>
    <span class="sep"></span>
    <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Deshacer</button>
  </nav>
</div>

<!-- ============ EDITOR DE FOTO ============ -->
<div class="app" id="ped">
  <header>
    <button class="hbtn" id="pedBack">‹ Plano</button>
    <input id="pedName" placeholder="Descripción de la foto">
    <div class="last">—</div>
    <button class="hbtn btbtn"><span class="dot"></span>Láser</button>
  </header>
  <div class="stage" id="pstage">
    <canvas id="pcv"></canvas>
    <div class="hint" id="phint"></div>
    <div class="pill" id="pcount">0/0</div>
    <button class="fab" id="pfitBtn">⤢ Encuadrar</button>
    <div class="props" id="pprops"></div>
  </div>
  <nav class="tools">
    <button class="tool" data-ptool="arrow"><svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>Cota</button>
    <button class="tool" data-ptool="note"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Texto</button>
    <button class="tool" data-ptool="sel"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Elegir</button>
    <span class="sep"></span>
    <button class="tool" id="pUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Deshacer</button>
    <button class="tool" id="pExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M4 15v5h16v-5"/></svg>Exportar</button>
    <button class="tool" id="pDelPhoto"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Borrar</button>
  </nav>
</div>

<div id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>

<script>
"use strict";
/* ============ Constantes y estado ============ */
const SVC = '02a6c0d0-0451-4000-b000-fb3210111989';
const CHR = '02a6c0d1-0451-4000-b000-fb3210111989';
const STORE = 'levantamientos_v1';
const DEF_SET = {tExt:0.20, tTab:0.10, ortho:true, auto:true, faceDef:'int', square:true, sillDef:0.90, hDef:2.40, slabDef:0.20, ghost:true};
const OPDEF = {door:0.80, win:1.20, fwin:1.80, gap:0.90};
const OPNAME = {door:'Puerta', win:'Ventana', fwin:'Ventanal', gap:'Vano vacío'};
const OPPRE = {door:'P', win:'V', fwin:'VT', gap:'VN'};
const OPH = {door:2.10, win:1.20, fwin:2.10, gap:2.10};      // altura de vano por defecto
const isWin = k => k==='win' || k==='fwin';
function sillOf(o){ return o.kind==='fwin' ? 0 : o.kind==='win' ? (o.sill ?? db.settings.sillDef ?? 0.90) : 0; }
function opHeight(o){ return o.h ?? OPH[o.kind]; }
function wallHeight(w, p){
  // altura del muro: la propia, si no la del recinto más cercano con altura, si no la del proyecto
  p=p||P; if(w.h!=null) return {v:w.h, src:'propia'};
  let best=null, bd=Infinity;
  for(const l of p.labels) if(l.h!=null){ const d=segDist(l.x,l.y,w.a.x,w.a.y,w.b.x,w.b.y).d; if(d<bd){ bd=d; best=l; } }
  if(best) return {v:best.h, src:best.text};
  return {v:db.settings.hDef ?? 2.40, src:'por defecto'};
}
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let db = {projects:[], current:null, settings:{...DEF_SET}};
let P = null;
let view = {s:40, ox:0, oy:0};
let W = 0, H = 0, dpr = 1;
let tool = 'ext', opKind = 'door';
let sel = null;               // {kind:'wall'|'dim'|'label'|'open'|'photo', id, field}
let draft = null;
let aimDraft = null;   // nueva foto: {x,y,dir} mientras se arrastra la dirección
let undoStack = [];
let lastMeasure = null;
let bt = {dev:null, ch:null, state:'off', lastRaw:'', lastT:0, lastV:null};

/* ============ Almacenamiento ============ */
function load(){
  try{
    const r = localStorage.getItem(STORE);
    if(r){ const d = JSON.parse(r); db.projects = d.projects||[]; db.current = d.current; db.settings = {...DEF_SET, ...(d.settings||{})}; if(db.settings.interior===false && !(d.settings||{}).faceDef) db.settings.faceDef='eje'; }
  }catch(e){}
}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }
function saveNow(){
  try{
    syncLevel(P);
    // cada nivel guarda sus propios datos; los del nivel activo no se duplican
    const out={...db, projects:db.projects.map(p=>{ if(!p.levels) return p; const q={...p}; for(const k of LV_KEYS) delete q[k]; return q; })};
    localStorage.setItem(STORE, JSON.stringify(out));
  }catch(e){ toast('No se pudo guardar en el teléfono'); }
}
/* ============ Niveles ============ */
const LV_KEYS=['walls','dims','labels','openings','cols','photos','aligns','cnt','fcnt','dirty','rectified'];
const LV_NAMES=['1er','2do','3er','4to','5to','6to','7mo','8vo'];
function levelName(i){ return (LV_NAMES[i]||(i+1)+'°')+' nivel'; }
function normLevel(L){ for(const k of ['walls','dims','labels','openings','cols','photos','aligns']) L[k]=L[k]||[]; L.cnt=L.cnt||{}; L.fcnt=L.fcnt||0; return L; }
function blankLevel(i){ return normLevel({id:'L'+Date.now()+Math.floor(Math.random()*1000), name:levelName(i), npt:null, slab:null, dirty:true, rectified:false}); }
function loadLevel(p,i){ p.cur=i; const L=p.levels[i]; for(const k of LV_KEYS) p[k]=L[k]; }
function syncLevel(p){ p=p||P; if(!p||!p.levels||p.walls===undefined) return; const L=p.levels[p.cur||0]; if(!L) return; for(const k of LV_KEYS) L[k]=p[k]; }   // solo si el nivel activo está cargado
function normalize(p){
  p.log=p.log||[]; p.seq=p.seq||1;
  if(!p.levels){ const L={id:'L1', name:levelName(0), npt:0, slab:null}; for(const k of LV_KEYS) L[k]=p[k]; p.levels=[L]; p.cur=0; }
  else if(p===P) syncLevel(p);
  p.levels.forEach(normLevel); if(p.cur==null || p.cur>=p.levels.length) p.cur=0;
  loadLevel(p,p.cur); return p;
}
function levelH(L){ const v=[...L.labels.filter(l=>l.h!=null).map(l=>l.h), ...L.walls.filter(w=>w.h!=null).map(w=>w.h)]; return v.length?Math.max(...v):(db.settings.hDef??2.40); }
function slabOf(L){ return L.slab ?? db.settings.slabDef ?? 0.20; }
function nptOf(i, p){
  // NPT automático: hacia arriba desde el nivel de referencia (piso inferior + altura + losa);
  // hacia abajo (subterráneos): piso superior − altura propia − losa propia
  p=p||P; const L=p.levels[i]; if(L.npt!=null) return L.npt;
  const anyRef=p.levels.some(x=>x.npt!=null);
  const up=()=>{ const B=p.levels[i-1]; return nptOf(i-1,p)+levelH(B)+slabOf(B); };
  if(!anyRef) return i===0 ? 0 : up();
  if(p.levels.slice(0,i).some(x=>x.npt!=null)) return up();
  return nptOf(i+1,p)-levelH(L)-slabOf(L);
}
function fmtNPT(v){ v=Math.round((v||0)*1000)/1000; return Math.abs(v)<0.0005 ? '±0.00' : (v>0?'+':'−')+Math.abs(v).toFixed(2); }
function withLevel(i, fn){
  const prev=P.cur, us=undoStack, s0=sel; syncLevel(); loadLevel(P,i); undoStack=[]; sel=null;
  try{ return fn(P.levels[i], i); } finally { syncLevel(); loadLevel(P,prev); undoStack=us; sel=s0; }
}
async function withLevelAsync(i, fn){
  const prev=P.cur, us=undoStack, s0=sel; syncLevel(); loadLevel(P,i); undoStack=[]; sel=null;
  try{ return await fn(P.levels[i], i); } finally { syncLevel(); loadLevel(P,prev); undoStack=us; sel=s0; }
}
function unionBounds(){ let b=null; P.levels.forEach((L,i)=>{ const x=bounds(L); if(!x) return; b = b ? {x0:Math.min(b.x0,x.x0), y0:Math.min(b.y0,x.y0), x1:Math.max(b.x1,x.x1), y1:Math.max(b.y1,x.y1)} : {...x}; }); return b; }
function switchLevel(i){
  if(i===P.cur) return; syncLevel(); loadLevel(P,i); sel=null; draft=null; undoStack=[]; pending=null;
  save(); updateLevelPill(); renderProps(); draw(); toast(P.levels[i].name+' · piso '+fmtNPT(nptOf(i)));
}
function addLevel(copy, below){
  syncLevel(); const i=P.levels.length, L=blankLevel(i);
  if(below){ const nb=P.levels.filter(x=>/^Subterráneo/.test(x.name)).length; L.name = nb ? 'Subterráneo '+(nb+1) : 'Subterráneo'; }
  else L.name = levelName(P.levels.filter(x=>!/^Subterráneo/.test(x.name)).length);
  if(copy){
    const src=P.levels[P.cur], map={};
    for(const w of src.walls.filter(w=>w.type==='ext')){ const nw=JSON.parse(JSON.stringify(w)); nw.id=P.seq++; map[w.id]=nw.id; delete nw.h; L.cnt.M=(L.cnt.M||0)+1; nw.name='M'+L.cnt.M; L.walls.push(nw); }
    for(const w of L.walls) for(const q of [w.a,w.b]) if(q.on!=null){ if(map[q.on]!=null) q.on=map[q.on]; else delete q.on; }
    L.aligns=src.aligns.filter(al=>map[al.a]!=null && map[al.b]!=null).map(al=>({a:map[al.a], b:map[al.b]}));
    L.dirty=src.dirty; L.rectified=src.rectified;
  }
  if(below){ const at=P.cur; P.levels.splice(at,0,L); P.cur=at+1; switchLevel(at); }   // queda bajo el nivel actual
  else { P.levels.push(L); switchLevel(i); }
}
async function deleteLevel(i){
  if(P.levels.length<2) return toast('Debe quedar al menos un nivel');
  const L=P.levels[i]; const ok=await ask('Eliminar nivel', `Se borrará «${L.name}» con sus muros, vanos y fotos.`, 'Eliminar', true); if(!ok) return openLevels();
  syncLevel(); for(const ph of L.photos){ try{ await idb.del(ph.id); }catch(e){} }
  P.levels.splice(i,1); const c = P.cur===i ? 0 : (P.cur>i ? P.cur-1 : P.cur); loadLevel(P,c);
  sel=null; undoStack=[]; save(); updateLevelPill(); renderProps(); draw(); openLevels();
}
function updateLevelPill(){ const b=$('#lvBtn'); if(!b||!P) return; b.textContent='▤ '+P.levels[P.cur].name+' · '+fmtNPT(nptOf(P.cur)); }
function openLevels(){
  syncLevel();
  const items=P.levels.map((L,i)=>`<div class="it ${i===P.cur?'cur':''}" style="flex-wrap:wrap">
      <div style="flex:1 1 100%"><input data-lname="${i}" value="${esc(L.name)}" style="font:inherit;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:transparent;width:70%">
        <small style="display:block">${L.walls.length} muros · altura ${fmt(levelH(L))} · cielo ${fmtNPT(nptOf(i)+levelH(L))}</small></div>
      <label style="font-size:12px;color:var(--muted)">Piso (NPT) <input data-lnpt="${i}" type="text" inputmode="text" value="${L.npt??''}" placeholder="${(nptOf(i)).toFixed(2)}" style="width:76px;padding:6px;border:1px solid var(--line);border-radius:8px"><button data-lsign="${i}" title="Cambiar signo (para subterráneos)" style="padding:6px 9px">±</button></label>
      <label style="font-size:12px;color:var(--muted)">Losa sobre muros <input data-lslab="${i}" type="number" step="0.01" inputmode="decimal" value="${L.slab??''}" placeholder="${slabOf(L).toFixed(2)}" style="width:66px;padding:6px;border:1px solid var(--line);border-radius:8px"></label>
      ${i===P.cur?'<span class="sub" style="margin-left:auto">actual</span>':`<button data-lgo="${i}" style="margin-left:auto">Ir</button>`}
      <button class="danger" data-ldel="${i}">✕</button></div>`).join('');
  openSheet(`<h2>Niveles</h2>
    <p style="color:var(--muted);font-size:13px">Los pisos se miden desde el <b>±0,00</b> del proyecto. Si dejas el piso vacío se calcula solo: hacia arriba, piso inferior + altura de sus muros + losa; hacia abajo, piso superior − altura del subterráneo − su losa. Usa <b>±</b> para cotas negativas.</p>
    <div class="plist">${items}</div>
    <h3>Agregar nivel arriba</h3>

function bounds(p){

/* ============ Dibujo del plano ============ */
function drawGrid(c){
  let step = 1; if(view.s<12) step=5; else if(view.s>90) step=0.5;

  for(let pass=0; pass<2; pass++){
    const st = pass===0? step : step*5; c.strokeStyle = pass===0? 'rgba(0,0,0,.05)' : 'rgba(0,0,0,.10)';
    c.beginPath();
    for(let x=Math.floor(w0.x/st)*st; x<=w1.x; x+=st){ const sx=Math.round(x*view.s+view.ox)+.5; c.moveTo(sx,0); c.lineTo(sx,H); }
    for(let y=Math.floor(w0.y/st)*st; y<=w1.y; y+=st){ const sy=Math.round(y*view.s+view.oy)+.5; c.moveTo(0,sy); c.lineTo(W,sy); }
    c.stroke();
  }
  c.fillStyle='rgba(0,0,0,.45)'; c.font='11px system-ui'; c.textAlign='right'; c.fillText('cuadrícula '+(step<1?step.toFixed(1):step)+' m', W-10, H-10); c.textAlign='left';

  c.lineWidth=4; c.strokeStyle='rgba(255,255,255,.95)'; c.lineJoin='round'; c.strokeText(txt,0,0);

function renderPlan(c, v, o){
  o=o||{}; const k=o.k||1; const p=o.project||P; const bg=o.bg||'#f4f1ea';

  const isSel=(kind,id)=>o.sel && o.sel.kind===kind && o.sel.id===id;
  const wpx = w => Math.max(w.type==='ext'?3:2, w.t*v.s);

    c.strokeStyle=col; c.lineWidth=1.5*k; c.beginPath();

function drawAim(c, q, dir, k, preview){

function countAll(p){ p=p||P; syncLevel(p); let n=0,m=0,f=0; for(const L of p.levels){ const c=countFields(L); n+=c.n; m+=c.m; f+=L.photos.length; } return {n,m,f}; }

function ghostLevel(){
  // guía: el nivel de abajo; en el nivel más bajo (p. ej. subterráneo), el de arriba
  if(!P || !P.levels || db.settings.ghost===false || P.levels.length<2) return null;
  return P.cur>0 ? P.levels[P.cur-1] : P.levels[1];
}
/* ============ Enganches ============ */
function endpoints(exclPts){ const r=[]; for(const w of P.walls) r.push(w.a,w.b); for(const d of P.dims) r.push(d.a,d.b); return exclPts? r.filter(p=>!exclPts.includes(p)) : r; }
function rayHits(f, ux, uy, exclW){
  const hits=[];
  for(const w of P.walls){
    if(exclW && exclW.has(w)) continue;
    const ex=w.b.x-w.a.x, ey=w.b.y-w.a.y, den=ux*ey-uy*ex; if(Math.abs(den)<1e-9) continue;
    const ax=w.a.x-f.x, ay=w.a.y-f.y; const t=(ax*ey-ay*ex)/den, u=(ax*uy-ay*ux)/den;
    if(u>=-1e-6 && u<=1+1e-6 && t>0.05) hits.push({t, w:w.id});
  }
  return hits;
}
function nearestOnWall(sx, sy, R, exclW){
  let best=null, bd=R;
  for(const w of P.walls){
    if(exclW && exclW.has(w)) continue;
    const a=w2s(w.a), b=w2s(w.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y);
    if(r.d<bd){ bd=r.d; best={x:w.a.x+(w.b.x-w.a.x)*r.t, y:w.a.y+(w.b.y-w.a.y)*r.t, w, t:r.t}; }
  }
  return best;
}
function ptOf(s){ const q={x:s.x, y:s.y}; if(s.w!=null && (s.kind==='on'||s.kind==='int')) q.on=s.w; return q; }
function hostOf(q){ if(q.on==null) return null; const h=P.walls.find(w=>w.id===q.on); return h && len(h)>1e-6 ? h : null; }
function reattach(skipHosts){
  // los extremos amarrados a un muro (encuentros en T) se mantienen sobre él cuando ese muro se mueve
  for(const w of P.walls) for(const q of [w.a,w.b]){
    const h=hostOf(q); if(!h || h===w || (skipHosts && skipHosts.has(w))) continue;
    const other = q===w.a ? w.b : w.a; const dx=q.x-other.x, dy=q.y-other.y;
    const hx=h.b.x-h.a.x, hy=h.b.y-h.a.y, den=dx*hy-dy*hx; let nx, ny;
    if(Math.abs(den)>1e-9){ const t=((h.a.x-other.x)*hy-(h.a.y-other.y)*hx)/den; nx=other.x+dx*t; ny=other.y+dy*t; }   // sigue su propia dirección hasta el eje del muro
    else { const L2=hx*hx+hy*hy; const t=((q.x-h.a.x)*hx+(q.y-h.a.y)*hy)/L2; nx=h.a.x+hx*t; ny=h.a.y+hy*t; }
    if(Math.abs(nx-q.x)>1e-9 || Math.abs(ny-q.y)>1e-9) moveCoincident(q, nx, ny);
  }
}
function snapPoint(sx, sy, from, exclPts, exclW){
  const R=22; let best=null, bd=R;
  for(const p of endpoints(exclPts)){ const q=w2s(p); const d=Math.hypot(q.x-sx,q.y-sy); if(d<bd){ bd=d; best={x:p.x,y:p.y,kind:'end'}; } }
  const G=ghostLevel(); if(G && !best) for(const w of G.walls) for(const p of [w.a,w.b]){ const q=w2s(p); const d=Math.hypot(q.x-sx,q.y-sy); if(d<bd){ bd=d; best={x:p.x,y:p.y,kind:'end'}; } }
  if(best) return best;
  const w=s2w(sx,sy);
  if(from && db.settings.ortho){
    const dx=w.x-from.x, dy=w.y-from.y; const ang=Math.atan2(dy,dx); const step=Math.PI/4; const sn=Math.round(ang/step)*step;
    if(Math.abs(ang-sn)<0.15){
      const ux=Math.cos(sn), uy=Math.sin(sn); const proj=dx*ux+dy*uy;
      let bh=null, bdh=R/view.s;
      for(const hh of rayHits(from,ux,uy,exclW)){ if(Math.abs(hh.t-proj)<bdh){ bdh=Math.abs(hh.t-proj); bh=hh; } }
      if(bh!=null) return {x:from.x+ux*bh.t, y:from.y+uy*bh.t, kind:'int', w:bh.w};
      const L=Math.round(proj/0.05)*0.05; return {x:from.x+ux*L, y:from.y+uy*L, kind:'ortho'};
    }
  }
  const on=nearestOnWall(sx,sy,16,exclW); if(on) return {x:on.x, y:on.y, kind:'on', w:on.w.id};
  return {x:Math.round(w.x/0.05)*0.05, y:Math.round(w.y/0.05)*0.05, kind:'grid'};
}

/* ============ Selección ============ */
function hitTest(sx, sy){
  let best=null, bd=Infinity;
  for(const f of P.photos){ if(f.x==null) continue; const q=w2s(f); const d=Math.hypot(q.x-sx,q.y-sy); if(d<20 && d<bd){ bd=d; best={kind:'photo',id:f.id}; } }
  if(best) return best;
  for(const l of P.labels){ const q=w2s(l); const d=Math.hypot(q.x-sx,q.y-sy); if(d<26 && d<bd){ bd=d; best={kind:'label',id:l.id}; } }
  if(best) return best;
  for(const cl of P.cols){ const g=colGeom(cl); if(!g) continue; const q=w2s(g.c); const d=Math.hypot(q.x-sx,q.y-sy); if(d<Math.max(20,Math.max(g.W,g.D)*view.s/2+8) && d<bd){ bd=d; best={kind:'col',id:cl.id,field:colFields(cl)[0]}; } }
  if(best) return best;
  for(const o of P.openings){ const g=opGeom(o); if(!g) continue; const a=w2s(g.p1), b=w2s(g.p2); const r=segDist(sx,sy,a.x,a.y,b.x,b.y); if(r.d<Math.max(18,g.w.t*view.s/2+8) && r.d<bd){ bd=r.d; best={kind:'open',id:o.id,field:'len'}; } }
  if(best) return best;
  for(const d of P.dims){ const a=w2s(d.a), b=w2s(d.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y); if(r.d<18 && r.d<bd){ bd=r.d; best={kind:'dim',id:d.id}; } }
  for(const w of P.walls){ const a=w2s(w.a), b=w2s(w.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y); const tol=Math.max(18, w.t*view.s/2+8); if(r.d<tol && r.d<bd){ bd=r.d; best={kind:'wall',id:w.id}; } }
  return best;
}
function selCenter(){

let moreOpen=false;
let pending=null;   // acción que espera un toque: {type:'split'|'align', id}
function startPending(type, w){
  pending={type, id:w.id}; setTool('sel');
  $('#hint').innerHTML = type==='split' ? `<b style="color:var(--acc)">Toca sobre ${esc(w.name)} el punto donde se divide.</b>` : `<b style="color:var(--acc)">Toca el muro que va en el mismo eje que ${esc(w.name)}.</b>`;

  $('#pendCancel').onclick=()=>{ pending=null; setTool('sel'); };

function moveCoincident(o, nx, ny){ const ox=o.x, oy=o.y; for(const z of endpoints()) if(Math.abs(z.x-ox)<1e-6 && Math.abs(z.y-oy)<1e-6){ z.x=nx; z.y=ny; } }
function handlePending(sx, sy){
  const w=P.walls.find(x=>x.id===pending.id); const type=pending.type; pending=null; setTool('sel'); if(!w) return;
  if(type==='split'){
    const a=w2s(w.a), b=w2s(w.b); const r=segDist(sx,sy,a.x,a.y,b.x,b.y);
    if(r.d>30){ toast('Toca sobre el muro '+w.name); return; }
    splitWall(w, Math.max(0.05, Math.min(0.95, r.t))); return;
  }
  const h=hitTest(sx,sy); const o=h && h.kind==='wall' ? P.walls.find(x=>x.id===h.id) : null;
  if(!o || o===w){ toast('Toca otro muro'); return; }
  pushUndo(); P.aligns=P.aligns.filter(al=>!((al.a===w.id&&al.b===o.id)||(al.a===o.id&&al.b===w.id))); P.aligns.push({a:w.id, b:o.id});
  // lleva el croquis del segundo muro sobre el eje del primero
  const L=len(w), ux=(w.b.x-w.a.x)/L, uy=(w.b.y-w.a.y)/L;
  for(const end of ['a','b']){
    const q=o[end]; let t=(q.x-w.a.x)*ux+(q.y-w.a.y)*uy;
    // si ese extremo topaba con otro muro, se mantiene sobre él (intersección de ejes)
    const host=wallsAt(q).find(h=>h!==o && h!==w && !near(h.a,q,1e-6) && !near(h.b,q,1e-6));
    if(host){ const hx=host.b.x-host.a.x, hy=host.b.y-host.a.y, den=ux*hy-uy*hx;
      if(Math.abs(den)>1e-9) t=((host.a.x-w.a.x)*hy-(host.a.y-w.a.y)*hx)/den; }
    moveCoincident(q, w.a.x+ux*t, w.a.y+uy*t);
  }
  reattach(); sel={kind:'wall', id:w.id}; save(); renderProps(); draw(); toast(`${o.name} queda en el mismo eje que ${w.name}`);
}
function splitWall(w, t){
  pushUndo();
  const m={x:w.a.x+(w.b.x-w.a.x)*t, y:w.a.y+(w.b.y-w.a.y)*t};
  const w2={...w, id:P.seq++, name:nextName(w.type==='ext'?'M':'T'), a:{...m}, b:w.b, len:null};
  for(const o of P.openings.filter(o=>o.wall===w.id)){
    const g=opGeom(o); const tt=g? g.c/g.L : o.t;
    if(tt>t){ o.wall=w2.id; o.t=(tt-t)/(1-t); if(o.ref!=='b') o.off=null; } else { o.t=tt/t; if(o.ref==='b') o.off=null; }
  }
  for(const q of endpoints()) if(q.on===w.id){ const L=len(w); const tq=((q.x-w.a.x)*(w.b.x-w.a.x)+(q.y-w.a.y)*(w.b.y-w.a.y))/(L*L); if(tq>t) q.on=w2.id; }
  w.b={...m}; const had=w.len!=null; w.len=null;
  P.walls.splice(P.walls.indexOf(w)+1, 0, w2);
  sel={kind:'wall', id:w.id}; save(); renderProps(); draw();
  toast(`${w.name} quedó dividido en ${w.name} y ${w2.name}`+(had?'. Mide los dos tramos.':''), 3000);
}
function fitStroke(e){
  const L=len(e); if(!e.len || L<1e-6) return; const T=e.t!=null ? axisTarget(e) : e.len; pushUndo();
  const ux=(e.b.x-e.a.x)/L, uy=(e.b.y-e.a.y)/L; const dx=e.a.x+ux*T-e.b.x, dy=e.a.y+uy*T-e.b.y; const ox=e.b.x, oy=e.b.y;
  for(const p of endpoints()) if(Math.abs(p.x-ox)<1e-6 && Math.abs(p.y-oy)<1e-6){ p.x+=dx; p.y+=dy; }
  reattach(); save(); draw(); toast('Trazo ajustado a '+fmt(e.len)+' m');
}

/* ============ Rectificar planta con las medidas ============ */
function solveLin(M, v){
  const n=v.length; const A=M.map((r,i)=>{ const x=Array.from(r); x.push(v[i]); return x; });
  for(let c=0;c<n;c++){
    let piv=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[piv][c])) piv=r;
    if(Math.abs(A[piv][c])<1e-12) return null; [A[c],A[piv]]=[A[piv],A[c]];
    for(let r=c+1;r<n;r++){ const f=A[r][c]/A[c][c]; if(f===0) continue; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; }
  }
  const x=new Float64Array(n); for(let r=n-1;r>=0;r--){ let sum=A[r][n]; for(let k=r+1;k<n;k++) sum-=A[r][k]*x[k]; x[r]=sum/A[r][r]; } return x;
}
function cornerPt(pt, toward, p, mode){
  // punto de la cara (interior: hacia el otro extremo; exterior: hacia afuera) de una esquina o encuentro
  const sgn=FACESIGN[mode||'int']; if(!sgn) return {x:pt.x, y:pt.y};
  const dirs=[]; let ox=0, oy=0;
  for(const w of wallsAt(pt,p)){
    const L=len(w); const nx=-(w.b.y-w.a.y)/L, ny=(w.b.x-w.a.x)/L;
    if(dirs.some(d=>Math.abs(d.nx*nx+d.ny*ny)>0.9)) continue; dirs.push({nx,ny});
    const sg=(Math.sign((toward.x-pt.x)*nx+(toward.y-pt.y)*ny)||1)*sgn; ox+=nx*sg*w.t/2; oy+=ny*sg*w.t/2;
  }
  return {x:pt.x+ox, y:pt.y+oy};
}
function isLocator(d, p){
  // cota recta paralela a un muro: se usa como medida para ubicar (no como control)
  const L=len(d); if(L<1e-6) return false; const ux=(d.b.x-d.a.x)/L, uy=(d.b.y-d.a.y)/L;
  return (p||P).walls.some(w=>{ const Lw=len(w); return Lw>1e-6 && Math.abs(ux*(w.b.x-w.a.x)/Lw+uy*(w.b.y-w.a.y)/Lw)>0.996; });
}
function diagChecks(p){
  p=p||P; return p.dims.filter(d=>d.len!=null && !d.use && !isLocator(d,p)).map(d=>{ const a=cornerPt(d.a,d.b,p,faceOf(d)), b=cornerPt(d.b,d.a,p,faceOf(d)); const got=Math.hypot(b.x-a.x,b.y-a.y); return {d, got, delta:got-d.len}; });
}
const DEG=Math.PI/180;
function mainAxis(walls){
  // ángulo (módulo 90°) que más largo de muros comparte; si está a menos de 10° de los ejes, se lleva a 0°
  const m90=a=>{ let r=a%(Math.PI/2); if(r<0) r+=Math.PI/2; return r; };
  const dif=(a,b)=>{ let d=Math.abs(m90(a)-m90(b)); return Math.min(d, Math.PI/2-d); };
  const angs=walls.filter(w=>w.ortho!==false).map(w=>({a:Math.atan2(w.b.y-w.a.y,w.b.x-w.a.x), L:len(w)}));
  if(!angs.length) return 0;
  let best=null, bs=-1; for(const c of angs){ const sc=angs.reduce((s2,o)=>s2+(dif(o.a,c.a)<0.5*DEG?o.L:0),0); if(sc>bs){ bs=sc; best=c.a; } }
  let sx=0, sy=0; for(const o of angs) if(dif(o.a,best)<0.5*DEG){ sx+=o.L*Math.cos(4*o.a); sy+=o.L*Math.sin(4*o.a); }
  const th=Math.atan2(sy,sx)/4; return Math.abs(th)<10*DEG ? 0 : th;
}
function relAngle(w, th){ const a=Math.atan2(w.b.y-w.a.y,w.b.x-w.a.x)-th; const k=Math.round(a/(Math.PI/4)); return {a, k, d:Math.abs(a-k*Math.PI/4)}; }
function isOrtho(w, th){
  // propiedad de cada muro; si no se ha definido: a escuadra solo si el trazo ya está a 0/45/90° (±2°)
  if(w.ortho!=null) return w.ortho;
  return relAngle(w, th==null ? mainAxis(P.walls.filter(x=>len(x)>1e-6)) : th).d < 2*DEG;
}
function squareDirs(walls){
  const th=mainAxis(walls); const dir={}; let fixed=0; const angled=[];
  for(const w of walls){
    if(!isOrtho(w, th)){ angled.push(w); continue; }
    const r=relAngle(w, th); if(r.d>0.05*DEG) fixed++;
    const a=th+r.k*Math.PI/4; dir[w.id]={ux:Math.cos(a), uy:Math.sin(a)};
  }
  for(const al of P.aligns){ if(dir[al.a] && dir[al.b]){ const A=dir[al.a], B=dir[al.b]; const sg=Math.sign(A.ux*B.ux+A.uy*B.uy)||1; dir[al.b]={ux:A.ux*sg, uy:A.uy*sg}; } }

function rectify(){

  const SQ=squareDirs(walls), dir=SQ.dir;
  const pts=[]; for(const w of P.walls) pts.push(w.a,w.b); for(const d of P.dims) pts.push(d.a,d.b);
  const nodes=[], idx=new Map();
  for(const q of pts){ let k=nodes.findIndex(n=>near(n,q)); if(k<0){ k=nodes.length; nodes.push({x:q.x,y:q.y}); } idx.set(q,k); }
  const N=nodes.length, n=2*N;
  // datos fijos de la geometría del croquis
  const hostIds=nodes.map(()=>new Set()); for(const q of pts) if(q.on!=null) hostIds[idx.get(q)].add(q.on);
  const onLine=[]; for(let k=0;k<N;k++){ const q=nodes[k];
    for(const w of walls){ const i=idx.get(w.a), j=idx.get(w.b); if(k===i||k===j) continue;
      const r=segDist(q.x,q.y,w.a.x,w.a.y,w.b.x,w.b.y);
      if(hostIds[k].has(w.id) || (r.d<0.05 && r.t>0.001 && r.t<0.999)) onLine.push({k,w,i,j,t:r.t}); } }
  const wallInfo=walls.map(w=>({w, i:idx.get(w.a), j:idx.get(w.b), target:axisTarget(w), sk:{x:w.b.x-w.a.x, y:w.b.y-w.a.y}})).filter(o=>o.i!==o.j);
  const dimInfo=P.dims.filter(d=>d.len!=null && len(d)>1e-6).map(d=>{ const ca=cornerPt(d.a,d.b,P,faceOf(d)), cb=cornerPt(d.b,d.a,P,faceOf(d));
    const L=len(d), ux=(d.b.x-d.a.x)/L, uy=(d.b.y-d.a.y)/L; const corr=((cb.x-d.b.x)-(ca.x-d.a.x))*ux+((cb.y-d.b.y)-(ca.y-d.a.y))*uy;
    return {d, i:idx.get(d.a), j:idx.get(d.b), target:d.len-corr, loc:isLocator(d), use:!!d.use, u:{x:ux,y:uy}}; }).filter(o=>o.i!==o.j);
  let X=nodes.flatMap(q=>[q.x,q.y]);
  const unit=(i,j)=>{ const dx=X[2*j]-X[2*i], dy=X[2*j+1]-X[2*i+1], L=Math.hypot(dx,dy)||1; return {x:dx/L, y:dy/L}; };
  for(let it=0; it<15; it++){
    const M=Array.from({length:n},()=>new Float64Array(n)), v=new Float64Array(n);
    const row=(co,rhs,w)=>{ for(const [a1,c1] of co){ v[a1]+=w*c1*rhs; for(const [a2,c2] of co) M[a1][a2]+=w*c1*c2; } };
    const along=(i,j,u,rhs,w)=>row([[2*j,u.x],[2*j+1,u.y],[2*i,-u.x],[2*i+1,-u.y]], rhs, w);
    for(const o of wallInfo){
      const d=dir[o.w.id];
      if(d){ along(o.i,o.j,{x:-d.uy,y:d.ux},0,1e6); along(o.i,o.j,{x:d.ux,y:d.uy},o.target,o.w.len!=null?1000:0.05); }   // a escuadra
      else if(o.w.len!=null) along(o.i,o.j,unit(o.i,o.j),o.target,1000);                                                // en ángulo: solo su largo
      else { row([[2*o.j,1],[2*o.i,-1]],o.sk.x,0.05); row([[2*o.j+1,1],[2*o.i+1,-1]],o.sk.y,0.05); }                    // en ángulo sin medir: forma del croquis
    }
    for(const c of onLine){
      const d=dir[c.w.id]; const nrm = d ? {x:-d.uy,y:d.ux} : (u=>({x:-u.y,y:u.x}))(unit(c.i,c.j));
      along(c.i,c.k,nrm,0,1e6);
      row([[2*c.k,1],[2*c.i,-(1-c.t)],[2*c.j,-c.t]],0,0.05); row([[2*c.k+1,1],[2*c.i+1,-(1-c.t)],[2*c.j+1,-c.t]],0,0.05);
    }
    for(const o of dimInfo){ if(o.loc) along(o.i,o.j,o.u,o.target,1000); else if(o.use) along(o.i,o.j,unit(o.i,o.j),o.target,1000); }
    for(const al of P.aligns){
      const A=P.walls.find(w=>w.id===al.a), B=P.walls.find(w=>w.id===al.b); if(!A||!B||!dir[A.id]) continue;
      const nr={x:-dir[A.id].uy, y:dir[A.id].ux}, i=idx.get(A.a);
      for(const q of [B.a,B.b]){ const k=idx.get(q); if(k!==i) along(i,k,nr,0,1e6); }
    }
    for(let k=0;k<N;k++){ row([[2*k,1]],nodes[k].x,0.001); row([[2*k+1,1]],nodes[k].y,0.001); }
    const x=solveLin(M,v); if(!x) return null;
    let ch=0; for(let q=0;q<n;q++){ ch=Math.max(ch,Math.abs(x[q]-X[q])); } X=Array.from(x);
    if(ch<1e-7) break;
  }
  pushUndo();
  const disp=nodes.map((q,k)=>({x:q.x, y:q.y, dx:X[2*k]-q.x, dy:X[2*k+1]-q.y}));
  const move=o=>{ let sw=0,sx=0,sy=0; for(const d of disp){ const wt=1/((d.x-o.x)**2+(d.y-o.y)**2+1e-6); sw+=wt; sx+=wt*d.dx; sy+=wt*d.dy; } o.x+=sx/sw; o.y+=sy/sw; };
  P.labels.forEach(move); P.photos.forEach(f=>{ if(f.x!=null) move(f); }); P.cols.forEach(c=>{ if(c.mode!=='wall') move(c); });
  for(const q of pts){ const k=idx.get(q); q.x=X[2*k]; q.y=X[2*k+1]; }
  const bad=wallInfo.filter(o=>o.w.len!=null && Math.abs(len(o.w)-o.target)>0.02).map(o=>({w:o.w, got:len(o.w)-(o.target-o.w.len)}));
  const th=SQ.th, angled=SQ.angled.map(w=>{ let deg=(Math.atan2(w.b.y-w.a.y,w.b.x-w.a.x)-th)/DEG; deg=((deg%180)+180)%180; return {w, deg:Math.round(deg*10)/10}; });

}
async function offerRectifyAll(why){
  syncLevel();
  const pend=P.levels.map((L,i)=>({L,i})).filter(o=>o.L.walls.some(w=>w.len!=null) && !(o.L.rectified && o.L.dirty===false));
  if(!pend.length) return true;
  const go=await ask('Plantas sin rectificar', `Sin rectificar: ${pend.map(o=>o.L.name).join(', ')}. ¿Rectificarlas con las medidas para que ${why}?`, 'Rectificar');

    fitView(); draw(); if(warn) toast('Rectificadas. Hay avisos: revisa ☰ → Rectificar en cada nivel.', 4500); }

}
function deltaTxt(dl){ const cm=Math.round(dl*100); return (cm>0?'+':'')+cm+' cm'; }

function renumber(){
  const prev=P.dirty; pushUndo(); P.cnt={};
  const byId=(a,b)=>a.id-b.id;
  for(const w of [...P.walls].sort(byId)) w.name=nextName(w.type==='ext'?'M':'T');
  for(const d of [...P.dims].sort(byId)) d.name=nextName('C');

function assignMeasure(m, manual){
  const e=getEl(sel); if(!e || !FIELDS[sel.kind]) return false;
  const f = sel.kind==='label' ? 'h' : (sel.field || 'len'); pushUndo(); e[f]=r3(m); save();
  const COLF={w:'ancho', d:'largo', off:'distancia', r1v:'distancia 1', r2v:'distancia 2'};
  const lbl = sel.kind==='open' ? `${e.name} ${f==='len'?'ancho':f==='off'?'distancia':'alto'}` : sel.kind==='label' ? `${e.text} altura` : sel.kind==='col' ? `${e.name} ${COLF[f]||f}` : e.name;
  toast(`${lbl} = ${fmt(m)} m`); vibrate(40);
  if(db.settings.auto && !manual && sel.kind!=='label'){
    const rest = fieldsOf(sel.kind, e).find(x=>e[x]==null);
    if(rest) sel={...sel, field:rest}; else { const n=nextUnmeasured(e.id); if(n) sel=n; }
  }
  renderProps(); ensureVisible(); draw(); return true;
}
function onMeasure(m){
  m=r3(m); lastMeasure=m; $$('.last').forEach(x=>x.textContent=fmt(m));
  P.log.push({t:Date.now(), v:m}); if(P.log.length>500) P.log.shift(); save();

}

/* ============ Bluetooth Bosch GLM ============ */
function setBt(state){ bt.state=state; $$('.btbtn').forEach(b=>{ b.classList.toggle('on',state==='on'); b.classList.toggle('busy',state==='busy'); }); renderProps(); if(PE.open) pedProps(); }
async function btWrite(bytes){
  const d=new Uint8Array(bytes);
  try{ if(bt.ch.writeValueWithoutResponse) await bt.ch.writeValueWithoutResponse(d); else await bt.ch.writeValue(d); }
  catch(e){ try{ await bt.ch.writeValueWithResponse(d); }catch(e2){} }
}
function parseBosch(dv){
  // Paquete de medida: C0 55 10 06 ... distancia float32 little-endian desde el byte 7 (metros)
  if(dv.byteLength>=11 && dv.getUint8(0)===0xC0 && dv.getUint8(1)===0x55 && dv.getUint8(2)===0x10 && dv.getUint8(3)===0x06){
    const m=dv.getFloat32(7,true); if(isFinite(m) && m>0.01 && m<300) return m;
  }
  return null;
}
function onBtData(ev){
  const dv=ev.target.value; let hex=''; for(let i=0;i<dv.byteLength;i++) hex+=dv.getUint8(i).toString(16).padStart(2,'0')+' ';
  bt.lastRaw=hex.trim();
  const m=parseBosch(dv); if(m==null) return;
  const now=Date.now(); if(bt.lastV!=null && Math.abs(m-bt.lastV)<1e-6 && now-bt.lastT<500) return;
  bt.lastV=m; bt.lastT=now; onMeasure(m);
}
async function btConnect(){
  if(!navigator.bluetooth){ btHelp(true); return; }
  try{
    setBt('busy');
    if(!bt.dev){
      bt.dev = await navigator.bluetooth.requestDevice({filters:[{services:[SVC]},{namePrefix:'GLM'},{namePrefix:'Bosch'}], optionalServices:[SVC]});
      bt.dev.addEventListener('gattserverdisconnected', ()=>{ setBt('off'); toast('Huincha desconectada. Toca «Láser» para reconectar.', 3000); });
    }
    const srv=await bt.dev.gatt.connect();
    const svc=await srv.getPrimaryService(SVC);
    const ch=await svc.getCharacteristic(CHR);
    bt.ch=ch; await ch.startNotifications();
    if(!ch._hooked){ ch.addEventListener('characteristicvaluechanged', onBtData); ch._hooked=true; }
    await btWrite([0xC0,0x55,0x02,0x01,0x00,0x1A]);   // activa el envío automático de cada medida
    setBt('on'); toast('Huincha conectada ✔'); vibrate(60); keepAwake();
  }catch(e){
    setBt('off');
    if(e && e.name==='NotFoundError') return;
    toast('No se pudo conectar: '+(e && e.message || e), 4000);
  }
}

/* ============ Interacción táctil del plano ============ */
const pts=new Map(); let gest=null;
function local(e, el){ const r=(el||cv).getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); const p=local(e); pts.set(e.pointerId,p);
  if(pts.size===2){
    draft=null; aimDraft=null; const [p1,p2]=[...pts.values()];
    gest={type:'pinch', d0:Math.hypot(p1.x-p2.x,p1.y-p2.y), m0:{x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2}, v0:{...view}}; draw(); return;
  }
  if(pts.size>2) return;
  gest={type:'one', start:p, moved:false, v0:{...view}};
  if(tool==='ext'||tool==='tab'||tool==='dim'){
    const s=snapPoint(p.x,p.y,null); draft={kind:tool, a:ptOf(s), b:{x:s.x,y:s.y}, sa:s, snap:null};
  } else if(tool==='foto'){
    const h=hitTest(p.x,p.y);
    if(h && h.kind==='photo'){ pushUndo(); gest={type:'aim', f:P.photos.find(x=>x.id===h.id), start:p, moved:false}; return; }
    gest.foto=true;
  } else if(tool==='sel'){
    const el=getEl(sel);
    if(el && el.a){
      for(const end of ['a','b']){ const q=w2s(el[end]); if(Math.hypot(q.x-p.x,q.y-p.y)<24){
        const o=el[end]; const moving=endpoints().filter(z=>Math.abs(z.x-o.x)<1e-6&&Math.abs(z.y-o.y)<1e-6);
        const exclW=new Set(P.walls.filter(w=>moving.includes(w.a)||moving.includes(w.b)));
        pushUndo(); gest={type:'drag', moving, exclW, start:p, moved:false}; return; } }
    }
    if(el && sel.kind==='wall'){
      const a=w2s(el.a), b=w2s(el.b);
      if(segDist(p.x,p.y,a.x,a.y,b.x,b.y).d<Math.max(22, el.t*view.s/2+10)){
        const moving=endpoints().filter(z=>near(z,el.a,1e-6)||near(z,el.b,1e-6));
        pushUndo(); gest={type:'move', moving:moving.map(z=>({z, x:z.x, y:z.y})), start:p, moved:false}; return; }
    }

function endPointer(e){

  const g=gest; gest=null;
  if(g.type==='aim'){ if(!g.moved){ undoStack.pop(); openPhoto(g.f.id); } else { save(); draw(); toast(g.f.name+': dirección actualizada'); } return; }
  if(g.foto && g.moved && aimDraft){ const a=aimDraft; aimDraft=null; draw(); askPhoto({x:a.x, y:a.y, dir:a.dir}); return; }
  aimDraft=null;
  if(g.type==='drag'||g.type==='slide'||g.type==='move'||g.type==='colmove'){
    if(!g.moved){ undoStack.pop(); if(pending){ handlePending(g.start.x,g.start.y); return; } }
    save(); draw(); return; }
  if(draft){
    const d=draft; draft=null;
    if(!g.moved || len(d)*view.s<12 || len(d)<0.05){ select(hitTest(g.start.x,g.start.y)); return; }
    pushUndo();
    if(d.kind==='dim'){ const el={id:P.seq++, name:nextName('C'), a:d.a, b:d.b, len:null}; P.dims.push(el); sel={kind:'dim',id:el.id}; }
    else { const el={id:P.seq++, type:d.kind, name:nextName(d.kind==='ext'?'M':'T'), a:d.a, b:d.b, t:d.kind==='ext'?db.settings.tExt:db.settings.tTab, len:null};
      if(!db.settings.ortho){ const r=relAngle(el,0); el.ortho = r.d<0.5*DEG; } P.walls.push(el); sel={kind:'wall',id:el.id}; }
    save(); renderProps(); ensureVisible(); draw(); return;
  }
  if(g.moved) return;
  if(pending){ handlePending(g.start.x,g.start.y); return; }
  const h=hitTest(g.start.x,g.start.y);
  if(tool==='col'){
    if(h && (h.kind==='col'||h.kind==='photo'||h.kind==='open')){ select(h); return; }
    const on=nearestOnWall(g.start.x,g.start.y,Math.max(16, 0.12*view.s)); pushUndo();
    let el;
    if(on) el={id:P.seq++, mode:'wall', name:nextName('PL'), wall:on.w.id, t:on.t, ref:'a', w:null, d:null, off:null};
    else { const q=s2w(g.start.x,g.start.y); const [r1,r2]=colRefsFor(q.x,q.y);

          r1w:r1?r1.w.id:null, r1s:r1?r1.sg:1, r1v:null, r2w:r2?r2.w.id:null, r2s:r2?r2.sg:1, r2v:null}; }
    P.cols.push(el); sel={kind:'col', id:el.id, field:'w'}; save(); renderProps(); ensureVisible(); draw(); return;
  }
  if(tool==='vano'){
    if(h && (h.kind==='open'||h.kind==='photo')){ select(h); return; }
    const on=nearestOnWall(g.start.x,g.start.y,Math.max(22, 0.15*view.s));
    if(!on){ toast('Toca sobre un muro o tabique'); return; }
    pushUndo(); const el={id:P.seq++, kind:opKind, name:nextName(OPPRE[opKind]), wall:on.w.id, t:on.t, len:null, off:null, h:null, ref:'a', flip:0};
    P.openings.push(el); sel={kind:'open',id:el.id,field:'len'}; save(); renderProps(); ensureVisible(); draw(); return;
  }
  if(tool==='txt'){
    if(h && h.kind==='label'){ select(h); return; }
    const w=s2w(g.start.x,g.start.y);
    askText('Nombre del recinto','', 'Ej: Dormitorio 1, Baño, Cocina').then(t=>{ if(!t) return; pushUndo(); const el={id:P.seq++, x:w.x, y:w.y, text:t, h:null}; P.labels.push(el); sel={kind:'label', id:el.id}; save(); renderProps(); ensureVisible(); draw(); });
    return;
  }
  if(tool==='foto'){
    if(h && h.kind==='photo'){ select(h); return; }
    const w=s2w(g.start.x,g.start.y); askPhoto({x:w.x, y:w.y}); return;
  }

}

  const allOk=P.levels.every(L=>L.rectified && L.dirty===false);
  for(let li=0; li<P.levels.length; li++){
    if(li>0){ doc.addPage(); y=16; }
    const Lv=P.levels[li], iy=y+9, ih= li===0 ? box1.h : boxN.h;
    doc.setDrawColor(...ink); doc.setLineWidth(0.4); doc.line(M,y,PW-M,y);
    doc.setTextColor(...ink); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(multi ? `PLANTA ${Lv.name.toUpperCase()}  ·  NPT ${fmtNPT(nptOf(li))}` : 'PLANTA DE LEVANTAMIENTO', M, y+5.5);
    const pl = ub ? withLevel(li, ()=>planImage(CW, ih, ub, sc)) : null;
    const ok=Lv.rectified && Lv.dirty===false;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if(!pl){ doc.text('Sin elementos dibujados.', M, y+14); continue; }
    doc.text(ok ? (pl.den ? `Escala 1:${pl.den}` : 'Sin escala') : 'Croquis sin escala (no rectificado)', PW-M, y+5.5, {align:'right'});
    doc.addImage(pl.data,'PNG',M,iy,CW,ih,undefined,'FAST');
    doc.setDrawColor(200); doc.setLineWidth(0.2); doc.rect(M,iy,CW,ih);
    const by=iy+ih+4;
    if(!ok){ doc.setFontSize(8); doc.setTextColor(...grey); doc.text('Croquis: proporciones aproximadas, valen las cotas.', M, by+3); }
    else { const Ls=[1,2,5,10,20,50,100]; let L=1; for(const l of Ls) if(l*pl.mmPerM<=50) L=l;
      const seg=L*pl.mmPerM/4; doc.setDrawColor(...ink); doc.setLineWidth(0.2);
      for(let i=0;i<4;i++){ doc.setFillColor(...(i%2?[255,255,255]:ink)); doc.rect(M+i*seg, by, seg, 1.6, 'FD'); }
      doc.setFontSize(7.5); doc.setTextColor(...ink); doc.text('0', M, by+5, {align:'center'}); doc.text(L+' m', M+4*seg, by+5, {align:'center'}); }
    doc.setTextColor(...grey); doc.setFontSize(8);
    doc.text((ok?'Planta rectificada con las medidas láser. ':'')+'Medidas en metros. Verde: medido · naranjo (?): pendiente.', PW-M, by+1.5, {align:'right', maxWidth:CW-60});
  }
  // ---- Tablas por nivel ----
  const v=x=>x==null?'':fmt(x);
  doc.addPage(); y=24;
  for(let li=0; li<P.levels.length; li++){
    const Lv=P.levels[li];
    withLevel(li, ()=>{
      if(y>PH-60){ doc.addPage(); y=24; }
      doc.setTextColor(...ink); doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text('TABLA DE MEDIDAS'+(multi?`  ·  ${Lv.name.toUpperCase()} (NPT ${fmtNPT(nptOf(li))})`:''), M, y);
      const dc={}; if(Lv.rectified && Lv.dirty===false) for(const c2 of diagChecks()) dc[c2.d.id]=c2;
      const rows=measurable().map(({e,kind})=>{
        if(kind==='open'){ const w=wallOf(e); return [e.name, OPNAME[e.kind], (w?'en '+w.name:'')+(e.off!=null?', desde '+refLabel(e):'')+(isWin(e.kind)?`, antepecho ${fmt(sillOf(e))}`:''), '', e.len==null?'sin medir':fmt(e.len), e.off!=null?FACES[faceOf(e)]:'', v(e.off)||(e.off==null?'sin medir':''), v(e.h)]; }
        if(kind==='col'){ const sec = e.w==null||e.d==null ? 'sin medir' : `${fmt(e.w)} × ${fmt(e.d)}`;
          return [e.name, 'Pilar', colLoc(e), '', sec, e.mode==='wall'&&e.off!=null?FACES[faceOf(e)]:'', e.mode==='wall' ? (v(e.off)||'sin medir') : [e.r1v,e.r2v].map(x=>x==null?'?':fmt(x)).join(' / '), '']; }
        return [e.name, kind==='dim'?'Cota libre':(e.type==='ext'?'Muro':'Tabique'), kind==='dim'?(isLocator(e)?'ubicación (usada en la planta)':e.use?'define la forma':dc[e.id]?`control: planta ${fmt(dc[e.id].got)} (${deltaTxt(dc[e.id].delta)})`:'diagonal / control'):(e.ortho===false||!isOrtho(e)?'en ángulo':''), kind==='wall'?fmt(e.t):'', e.len==null?'sin medir':fmt(e.len), e.len!=null?FACES[faceOf(e)]:'', '', ''];
      });
      doc.autoTable({...TS, startY:y+4, head:[['Elem.','Tipo','Ubicación / referencia','Espesor','Medida / ancho','Cara','Dist. a esquina','Alto']],
        body:rows.length?rows:[['—','','Sin elementos','','','','','']],
        columnStyles:{3:{halign:'right'},4:{halign:'right',fontStyle:'bold'},5:{halign:'center'},6:{halign:'right'},7:{halign:'right'}}});
      y=doc.lastAutoTable.finalY+8;
      if(P.labels.length){
        if(y>PH-50){ doc.addPage(); y=26; }
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ink); doc.text('Recintos'+(multi?' · '+Lv.name:''), M, y);
        doc.autoTable({...TS, startY:y+3, head:[['Recinto','Altura interior (m)','Piso (NPT)']],
          body:P.labels.map(l=>[l.text, l.h==null?'sin medir':fmt(l.h), fmtNPT(nptOf(li))]), tableWidth:140,
          columnStyles:{1:{halign:'right',fontStyle:'bold'},2:{halign:'right'}}});
        y=doc.lastAutoTable.finalY+8;
      }
      const pc=[]; for(const ph of P.photos) for(const a of ph.arrows) pc.push([ph.name, ph.caption||'', a.name, a.len==null?'sin medir':fmt(a.len)]);
      if(pc.length){
        if(y>PH-50){ doc.addPage(); y=26; }
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ink); doc.text('Cotas en fotografías'+(multi?' · '+Lv.name:''), M, y);
        doc.autoTable({...TS, startY:y+3, head:[['Foto','Descripción','Cota','Medida']], body:pc, columnStyles:{3:{halign:'right',fontStyle:'bold'}}});
        y=doc.lastAutoTable.finalY+10;
      }
    });
  }
  // ---- Fotografías: 2 por página ----
  const slotTop=[22, 22+(PH-22-16)/2], slotH=(PH-22-16)/2-4;
  let i=0;
  for(let li=0; li<P.levels.length; li++){
    for(const ph of P.levels[li].photos){
      const data=await photoImage(ph); if(!data) continue;
      if(i%2===0) doc.addPage();
      const top=slotTop[i%2];
      doc.setTextColor(...ink); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.text(`${multi?P.levels[li].name+' · ':''}${ph.name}${ph.caption?' · '+ph.caption:''}`, M, top+4);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...grey);
      doc.text(`${ph.arrows.length} cota(s) · ${ph.notes.length} nota(s)${ph.x!=null?' · ubicada en planta':''}`, PW-M, top+4, {align:'right'});
      const aw=CW, ah=slotH-8; const r=Math.min(aw/ph.w, ah/ph.h); const w=ph.w*r, h=ph.h*r;
      doc.addImage(data,'JPEG', M+(aw-w)/2, top+7, w, h, undefined, 'FAST');
      i++;
    }
  }
  // ---- Encabezados y pies ----
  const N=doc.getNumberOfPages();
  for(let pg=1;pg<=N;pg++){
    doc.setPage(pg); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...grey);
    if(pg>1){ doc.text(`${P.name||'Levantamiento'}${P.address?' · '+P.address:''}`, M, 11); doc.text('Informe de levantamiento', PW-M, 11, {align:'right'});
      doc.setDrawColor(214,211,204); doc.setLineWidth(0.3); doc.line(M,13,PW-M,13); }
    doc.setDrawColor(214,211,204); doc.line(M,PH-11,PW-M,PH-11);
    doc.text(db.settings.author?('Levantado por '+db.settings.author):'', M, PH-7);
    doc.text(`Página ${pg} de ${N}`, PW-M, PH-7, {align:'right'});
  }
  return doc.output('blob');
}

/* ============ Exportar para Revit (lo lee el script de Dynamo) ============ */
function buildRevitJSON(){
  syncLevel(); const b=unionBounds(); const X0=b?b.x0:0, Y0=b?b.y1:0;           // origen común a todos los niveles
  const pt=q=>[r3(q.x-X0), r3(Y0-q.y)];                                         // metros, Y hacia arriba como en Revit
  const levels=P.levels.map((Lv,li)=>withLevel(li, ()=>({
    name:Lv.name, elevation:r3(nptOf(li)), slab:r3(slabOf(Lv)), rectified:!!(Lv.rectified && Lv.dirty===false),
    walls: P.walls.filter(w=>len(w)>1e-6).map(w=>{ const H=wallHeight(w); return {id:w.id, name:w.name, kind:w.type==='ext'?'muro':'tabique', thickness:w.t,
      start:pt(w.a), end:pt(w.b), height:r3(H.v), height_from:H.src, measured:w.len, face:faceOf(w)}; }),
    openings: P.openings.map(o=>{ const g=opGeom(o); if(!g) return null;
      return {id:o.id, name:o.name, kind:{door:'door', win:'window', fwin:'floor_window', gap:'opening'}[o.kind], wall:o.wall,
        center:r3(g.c), width:r3(o.len ?? OPDEF[o.kind]), height:r3(opHeight(o)), sill:r3(sillOf(o)), flip:o.flip||0, measured:o.len!=null}; }).filter(Boolean),
    rooms: P.labels.map(l=>({name:l.text, at:pt(l), height:l.h})),
    columns: P.cols.map(c=>{ const g=colGeom(c); if(!g) return null; const H = c.mode==='wall' && g.wall ? wallHeight(g.wall).v : levelH(Lv);
      return {id:c.id, name:c.name, center:pt(g.c), width:r3(c.w??COLDEF), depth:r3(c.d??COLDEF),
        rotation:r3(-Math.atan2(g.uy,g.ux)*180/Math.PI), height:r3(H), measured:c.w!=null&&c.d!=null}; }).filter(Boolean)
  })));
  return JSON.stringify({app:'levantamiento', version:2, units:'m',
    project:{name:P.name, address:P.address, owner:P.owner, date:P.date, rectified:levels.every(l=>l.rectified)}, levels}, null, 1);
}

function blobToDataURL(b){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }
async function buildBackup(){
  syncLevel(); const imgs={}; for(const ph of P.levels.flatMap(L=>L.photos)){ try{ const b=await idb.get(ph.id); if(b) imgs[ph.id]=await blobToDataURL(b); }catch(e){} }
  return JSON.stringify({app:'levantamiento', v:2, project:P, images:imgs});
}

      <select id="sFace" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line)">${['int','ext','eje'].map(f=>`<option value="${f}" ${(s.faceDef||'int')===f?'selected':''}>${FACES[f]}</option>`).join('')}</select></label>
    <h3>Cómo se usa</h3>

  $('#mClose').onclick=closeSheet;
  $('#xDXF').onclick=()=>{ if(!P.walls.length&&!P.dims.length) return toast('Aún no hay nada dibujado'); shareOrDownload(new Blob([buildDXF()],{type:'application/dxf'}), safeName()+'.dxf'); };

  $('#mImp').onclick=()=>$('#fileIn').click();

  $$('[data-open]').forEach(b=>b.onclick=()=>{ openProject(b.dataset.open); closeSheet(); });
  $$('[data-del]').forEach(b=>b.onclick=async()=>{
    const p=db.projects.find(x=>x.id===b.dataset.del); if(!p) return;
    const ok=await ask('Eliminar levantamiento', `Se borrará «${p.name}» y sus fotos de este teléfono. No se puede deshacer.`, 'Eliminar', true);
    if(!ok){ openMenu(); return; }
    for(const L of (p.levels||[p])) for(const ph of (L.photos||[])){ try{ await idb.del(ph.id); }catch(e){} }
    db.projects=db.projects.filter(x=>x.id!==p.id);
    if(p.id===P.id){ if(db.projects.length) openProject(db.projects[0].id); else newProject('Levantamiento'); }
    save(); openMenu();
  });
}

$('#fileIn').onchange=async e=>{

    for(const ph of p.levels.flatMap(L=>L.photos)){
      const nid='ph'+Date.now()+Math.floor(Math.random()*100000);
      if(imgs[ph.id]){ const blob=await (await fetch(imgs[ph.id])).blob(); await idb.put(nid, blob); }
      ph.id=nid;
    }
    db.projects.unshift(p); openProject(p.id); closeSheet(); toast('Respaldo importado ✔');
  }catch(err){ toast('Ese archivo no es un respaldo válido'); }
};
